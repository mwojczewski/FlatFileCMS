  - id: 01a06d50-5005-7509-8509-000000000009
    type: article-content
    enabled: true
    data:
      anchor: kontekst
      content:
        pl: |-
          ## 7. Escapuj zgodnie z kontekstem

          escape koduje tekst dla węzła HTML albo cytowanego atrybutu. Nie jest filtrem dla JavaScriptu, CSS-u czy fragmentu URL. Adresy przekazuj do url albo asset, a dane JavaScript serializuj bezpiecznym mechanizmem.

          Nie escapuj drugi raz wyniku markdown, image, picture ani partial - są to gotowe fragmenty zbudowane przez zaufane helpery. Nigdy jednak nie wypisuj surowego pola data, nawet gdy panel walidował typ. Walidacja struktury nie zastępuje kodowania dla kontekstu wyjściowego.

          ## 8. Markdown jest kontrolowanym formatem

          CommonMark pracuje z html_input ustawionym na strip, allow_unsafe_links na false oraz limitem zagnieżdżenia 20. Surowy HTML nie staje się furtką XSS, a niebezpieczne schematy linków są odrzucane.

          Wynik Markdown jest fragmentem, nie dokumentem. Osadzaj go w semantycznym kontenerze bloku. CSS może stylować standardowe elementy potomne, bez wymagania klas wpisywanych przez redaktora.

          ## 9. Używaj partiali do kodu wspólnego

          PartialRenderer korzysta z osobnego rejestru dozwolonych plików. context.partial z jawną mapą danych sprawdza się dla headera, footera czy breadcrumbs. Nie zastępuje bloku edytowalnego w Page Builderze.

          RenderContext zna locale, tożsamość strony i przygotowane media, ale nie ujawnia DI, PDO, sesji, requestu, SMTP, sekretów ani swobodnego systemu plików. Renderer pozostaje deterministyczną funkcją danych i helperów. Czas bieżący, losowość lub zewnętrzne API złamałyby tę własność.
        en: |-
          ## 7. Escape for the actual context

          escape encodes text for an HTML node or quoted attribute. It is not a filter for JavaScript, CSS or a URL fragment. Pass addresses to url or asset and serialize JavaScript data through a safe mechanism.

          Do not escape markdown, image, picture or partial results a second time-they are ready fragments built by trusted helpers. Never emit a raw data field, however, even if the admin validated its type. Structural validation does not replace output-context encoding.

          ## 8. Markdown is a controlled format

          CommonMark uses html_input strip, allow_unsafe_links false and a nesting limit of 20. Raw HTML cannot become an XSS path and unsafe link schemes are rejected.

          Markdown output is a fragment, not a document. Place it in the block's semantic container. CSS can style standard descendants without requiring classes typed by an author.

          ## 9. Use partials for shared code

          PartialRenderer uses a separate registry of allowed files. context.partial with an explicit data map suits a header, footer or breadcrumbs. It does not replace a block editable in Page Builder.

          RenderContext knows locale, page identity and prepared media, but exposes no DI, PDO, session, request, SMTP, secrets or unrestricted filesystem. A renderer remains a deterministic function of data and helpers. Current time, randomness or an external API would break this property.
      note:
        pl: "Walidacja mówi, czy wartość pasuje do kontraktu. Escaping mówi, czy można ją bezpiecznie umieścić w konkretnym miejscu dokumentu. Potrzebujesz obu."
        en: "Validation says whether a value fits the contract. Escaping says whether it can safely enter a specific document context. You need both."
  - id: 01a06d50-5005-7510-8510-000000000010
    type: article-content
    enabled: true
    data:
      anchor: media-assety
      content:
        pl: |-
          ## 10. Renderuj media ze wzbogaconych metadanych

          Blok zapisuje nazwę pliku lokalnego strony, a nie ręcznie składany URL. Fabryka ViewModel dodaje adres oryginału, MIME type, rozmiar, fingerprint oraz dla obrazu szerokość i wysokość.

          context.image tworzy img, a picture generuje responsywny srcset z uporządkowanych, unikalnych szerokości. Zakres wynosi 1–8192. Formaty wyjściowe to AVIF, JPEG, PNG i WebP. cover wymaga width i height, a w picture dodatniej proporcji.

          Helper dopuszcza tylko kontrolowane atrybuty, między innymi class, id, loading, decoding i fetchpriority, wraz z walidacją wartości. Tekst alternatywny powinien być danymi redakcyjnymi i opisywać rolę obrazu w kontekście.

          ## 11. Publikuj assety jako zasoby fingerprintowane

          Dla każdego użytego typu AssetCollector szuka opcjonalnych style.css i script.js. Symlinki są odrzucane. Limit źródła wynosi 1 MiB. AssetPublisher liczy SHA-256 i umieszcza pierwszych 16 znaków w nazwie.

          ~~~text
          blocks/feature/style.css
              -> public/assets/blocks/feature/feature.6a30762de00a7413.css
              -> /assets/blocks/feature/feature.6a30762de00a7413.css
          ~~~

          Katalog wynikowy jest odtwarzalnym artefaktem runtime. Nie edytuj pliku z hashem. Zmiana CSS tworzy nowy URL, więc stary HTML nadal wskazuje dokładnie wersję, dla której został wygenerowany.
        en: |-
          ## 10. Render media from enriched metadata

          A block stores a page-local filename rather than a hand-built URL. The ViewModel factory adds the original address, MIME type, size, fingerprint and, for an image, width and height.

          context.image creates img, while picture generates responsive srcset from sorted unique widths. The range is 1–8192. Output formats are AVIF, JPEG, PNG and WebP. cover requires width and height, while picture requires a positive aspect ratio.

          The helper permits only controlled attributes, including class, id, loading, decoding and fetchpriority, with value validation. Alternative text should be editorial data describing the image's contextual role.

          ## 11. Publish assets as fingerprinted resources

          For each used type AssetCollector looks for optional style.css and script.js. Symlinks are rejected. A source is limited to 1 MiB. AssetPublisher calculates SHA-256 and inserts the first 16 characters into the name.

          ~~~text
          blocks/feature/style.css
              -> public/assets/blocks/feature/feature.6a30762de00a7413.css
              -> /assets/blocks/feature/feature.6a30762de00a7413.css
          ~~~

          The output directory is a reproducible runtime artifact. Never edit a hashed file. Changing CSS creates a new URL, so older HTML still targets exactly the version against which it was generated.
      note:
        pl: "Gdy asset zwraca 403, sprawdź reguły serwera i WAF dla /assets/. Sam chmod 0644 przy katalogach 0755 może być prawidłowy."
        en: "When an asset returns 403, inspect server and WAF rules for /assets/. Chmod 0644 with 0755 directories may already be correct."
  - id: 01a06d50-5005-7511-8511-000000000011
    type: article-content
    enabled: true
    data:
      anchor: cache-http
      content:
        pl: |-
          ## 12. Wylicz walidatory z rzeczywistej reprezentacji

          Po zbudowaniu dokumentu kontroler liczy ETag jako SHA-256 dokładnych bajtów HTML. Last-Modified jest maksymalnym mtime istotnych zależności: strony, definicji bloków, mediów, wyrenderowanych assetów, layoutu, partiali, indeksu tras, języków, ustawień instalacji i nawigacji.

          Odpowiedź zawiera Cache-Control: public, max-age=0, must-revalidate. Klient lub CDN może zachować reprezentację, lecz przed użyciem musi ją zweryfikować. Zgodny If-None-Match lub If-Modified-Since pozwala zwrócić 304 bez body.

          ETag pyta, czy bajty są identyczne. Last-Modified daje walidator czasowy. Śledzenie zależności powoduje, że zmiana renderera lub headera odświeża stronę nawet bez modyfikacji content.yml.

          ## 13. Odróżnij cache HTTP od cache aplikacji

          Cache sparsowanego YAML i warianty mediów przyspieszają serwer. Cache HTTP przechowuje gotową reprezentację między klientem, CDN-em i aplikacją. Purge Cloudflare nie naprawi trasy ani PHP; cache:clear nie zmieni reguły 403 serwera WWW.

          Panel i strony błędów korzystają z no-store. Publiczne HTML i JSON mogą używać rewalidacji, ponieważ ich walidatory wynikają ze stabilnych reprezentacji.
        en: |-
          ## 12. Calculate validators from the real representation

          After composing the document, the controller calculates ETag as SHA-256 of exact HTML bytes. Last-Modified is the maximum mtime across relevant dependencies: page, block definitions, media, rendered assets, layout, partials, route index, languages, setup settings and navigation.

          The response contains Cache-Control: public, max-age=0, must-revalidate. A client or CDN may retain the representation but must validate it before use. Matching If-None-Match or If-Modified-Since allows a bodyless 304.

          ETag asks whether bytes are identical. Last-Modified provides a time validator. Dependency tracking makes a renderer or header change refresh the page even when content.yml is untouched.

          ## 13. Distinguish HTTP cache from application cache

          Parsed-YAML cache and media variants accelerate the server. HTTP cache stores a ready representation between client, CDN and application. A Cloudflare purge cannot repair routing or PHP; cache:clear cannot change a web-server 403 rule.

          The admin and error pages use no-store. Public HTML and JSON can use revalidation because their validators derive from stable representations.
      note:
        pl: "Odpowiedź 304 nie zawiera nowej strony - potwierdza, że reprezentacja zachowana przez klienta nadal jest aktualna."
        en: "A 304 response contains no new page-it confirms that the client's stored representation remains current."
  - id: 01a06d50-5005-7512-8512-000000000012
    type: article-content
    enabled: true
    data:
      anchor: kolekcje
      content:
        pl: |-
          ## 14. Kolekcje przechodzą przez analogiczny pipeline

          Gdy trasa wskazuje kolekcję, kontroler wykonuje query: wybiera aktywne bezpośrednie dzieci, stosuje dozwolone filtry, sortowanie i paginację. Dopiero wynik zapytania trafia do modelu widoku listy i layoutu kolekcji.

          Renderer listy nie powinien samodzielnie filtrować stron ani ufać dowolnym parametrom query string. Allowlisty i typy należą do kontraktu kolekcji. Publiczny link elementu pochodzi z indeksu tras dla aktualnego locale, nie z konkatenacji katalogów.

          Czas modyfikacji odpowiedzi musi uwzględnić pagination.yml oraz strony wpływające na wynik. Dodanie, usunięcie, wyłączenie lub zmiana pola sortowania dziecka może zmienić HTML listy bez dotykania samej kolekcji.

          ## 15. Testuj kontrakt na trzech poziomach

          Test jednostkowy renderera podaje kontrolowane data i fałszywy lub rzeczywisty RenderContext, a następnie asercje wykonuje na semantycznych elementach HTML. Test integracyjny buduje PageViewModel z YAML-a i sprawdza lokalizację, media oraz kolejność. Test HTTP weryfikuje status, nagłówki cache i pełną reprezentację.

          Nie opieraj testu wyłącznie na ogromnym snapshotcie HTML. Małe asercje lepiej wskazują uszkodzoną odpowiedzialność: brak escape, niewłaściwy URL językowy, zdublowany CSS albo błędne 304.
        en: |-
          ## 14. Collections follow an analogous pipeline

          When a route identifies a collection, the controller executes its query: selects enabled direct children and applies allowed filtering, sorting and pagination. Only that result enters the list view model and collection layout.

          The list renderer should neither filter pages itself nor trust arbitrary query-string parameters. Allowlists and types belong to the collection contract. An item's public link comes from the locale route index, not directory concatenation.

          Response modification time must include pagination.yml and pages affecting the result. Adding, removing, disabling or changing a child's sort field can change list HTML without touching the collection itself.

          ## 15. Test the contract at three levels

          A renderer unit test supplies controlled data and a fake or real RenderContext, then asserts semantic HTML elements. An integration test builds PageViewModel from YAML and checks localization, media and order. An HTTP test verifies status, cache headers and the complete representation.

          Do not rely solely on one huge HTML snapshot. Small assertions identify a broken responsibility more clearly: missing escaping, incorrect localized URL, duplicated CSS or an invalid 304.
      note:
        pl: "Testy powinny udowadniać granice pipeline, a nie utrwalać przypadkowe białe znaki wygenerowanego dokumentu."
        en: "Tests should prove pipeline boundaries rather than preserve incidental whitespace in the generated document."
  - id: 01a06d50-5005-7513-8513-000000000013
    type: diagnostic-table
    enabled: true
    data:
      anchor: diagnostyka-renderingu
      eyebrow:
        pl: "16 / Diagnostyka"
        en: "16 / Troubleshooting"
      title:
        pl: "Diagnozuj od wejścia pipeline do odpowiedzi HTTP."
        en: "Diagnose from pipeline input toward the HTTP response."
      intro:
        pl: "Ten sam objaw może mieć źródło w trasie, danych, rendererze, assetach lub cache. Znajdź pierwszą warstwę, na której wynik jest błędny."
        en: "The same symptom may originate in routing, data, a renderer, assets or cache. Find the earliest layer where output becomes wrong."
      rows:
        - layer:
            pl: Routing
            en: Routing
          problem:
            pl: "Istniejący plik zwraca 404"
            en: "An existing file returns 404"
          cause:
            pl: "URL wynika z locale i slugów, nie z nazwy katalogu."
            en: "URL derives from locale and slugs, not the directory name."
          check:
            pl: "Sprawdź locale, slugi przodków i PageRouteIndex."
            en: "Check locale, ancestor slugs and PageRouteIndex."
        - layer:
            pl: ViewModel
            en: ViewModel
          problem:
            pl: "Tekst jest w złym języku"
            en: "Text is in the wrong language"
          cause:
            pl: "Fallback albo surowa mapa dotarła do renderera."
            en: "Fallback or a raw map reached the renderer."
          check:
            pl: "Porównaj content.yml z przetworzonym data i locale kontekstu."
            en: "Compare content.yml with processed data and context locale."
        - layer:
            pl: Renderer
            en: Renderer
          problem:
            pl: "Strona urywa się na bloku"
            en: "Page stops at a block"
          cause:
            pl: "Wyjątek, błąd PHP lub niewłaściwy typ danych."
            en: "Exception, PHP error or wrong data type."
          check:
            pl: "Sprawdź log, definition.yml i pierwszy brakujący render.php."
            en: "Inspect log, definition.yml and the first missing render.php."
        - layer:
            pl: Layout
            en: Layout
          problem:
            pl: "Brak nawigacji lub head"
            en: "Navigation or head is missing"
          cause:
            pl: "Inny layout lub brak danych partiala."
            en: "Different layout or missing partial data."
          check:
            pl: "Sprawdź pole layout, rejestr i argumenty partial."
            en: "Check layout field, registry and partial arguments."
        - layer:
            pl: Assety
            en: Assets
          problem:
            pl: "HTML działa bez stylów"
            en: "HTML works without styles"
          cause:
            pl: "Brak publikacji, odpowiedź 403/404 lub pominięty typ."
            en: "No publication, 403/404 response or omitted type."
          check:
            pl: "Otwórz fingerprintowany URL i sprawdź reguły /assets/ oraz źródłowy CSS."
            en: "Open the fingerprinted URL and inspect /assets/ rules and source CSS."
        - layer:
            pl: Media
            en: Media
          problem:
            pl: "Oryginał działa, wariant nie"
            en: "Original works but variant fails"
          cause:
            pl: "Format, wymiar lub geometria nie spełnia kontraktu."
            en: "Format, dimension or geometry violates the contract."
          check:
            pl: "Sprawdź MIME, zakres 1–8192 oraz wymagania cover."
            en: "Check MIME, range 1–8192 and cover requirements."
        - layer:
            pl: "Cache HTTP"
            en: "HTTP cache"
          problem:
            pl: "Po wdrożeniu widać starą wersję"
            en: "Old version remains after deployment"
          cause:
            pl: "Zależność nie zmieniła walidatora, CDN zachował odpowiedź albo pliku nie wdrożono."
            en: "A dependency did not change the validator, CDN retained a response or file was not deployed."
          check:
            pl: "Porównaj ETag, Last-Modified, HTML oraz mtime źródeł."
            en: "Compare ETag, Last-Modified, HTML and source mtimes."
      note:
        pl: "Testuj odpowiedź origin oraz odpowiedź przez CDN. To dwie osobne warstwy i mogą zwracać różne nagłówki."
        en: "Test the origin response and the response through CDN. They are separate layers and may return different headers."
  - id: 01a06d50-5005-7514-8514-000000000014
    type: article-content
    enabled: true
    data:
      anchor: checklista-renderingu
      content:
        pl: |-
          ## 17. Checklista bezpiecznego renderera

          Przed wydaniem potwierdź:

          1. renderer używa tylko data i context;
          2. zwykły tekst przechodzi przez escape;
          3. Markdown pochodzi z pola o takim kontrakcie;
          4. adresy przechodzą przez url albo asset;
          5. gotowy wynik helpera HTML nie jest escapowany drugi raz;
          6. obraz ma alt i określoną geometrię;
          7. picture ma rozsądne, unikalne szerokości;
          8. layout emituje jeden dokument i osadza content raz;
          9. assety są małe i nie są symlinkami;
          10. renderer nie korzysta z czasu, losowości lub ukrytych danych;
          11. zmiana layoutu, partiala, media lub assetu zmienia walidator;
          12. zgodny If-None-Match daje 304 bez body;
          13. PL i EN przełączają się między odpowiednikami;
          14. composer check i php bin/cms release:check kończą się sukcesem.

          Dobry pipeline nie ukrywa magii w szablonach. Dane są rozpoznawane, walidowane i lokalizowane wcześniej, a renderer wykonuje małą, przewidywalną pracę prezentacyjną.
        en: |-
          ## 17. Safe-renderer checklist

          Before release, confirm that:

          1. the renderer uses only data and context;
          2. plain text goes through escape;
          3. Markdown comes from a field with that contract;
          4. addresses go through url or asset;
          5. ready HTML-helper output is not escaped twice;
          6. an image has alt text and defined geometry;
          7. picture receives sensible unique widths;
          8. layout emits one document and embeds content once;
          9. assets are small and are not symlinks;
          10. the renderer uses no time, randomness or hidden data;
          11. changing layout, partial, media or asset changes the validator;
          12. matching If-None-Match yields a bodyless 304;
          13. PL and EN switch between equivalents;
          14. composer check and php bin/cms release:check succeed.

          A good pipeline hides no magic in templates. Data is resolved, validated and localized earlier, while a renderer performs small, predictable presentation work.
      note:
        pl: "Najlepszy renderer jest nudny - bierze gotowe dane, używa bezpiecznych helperów i emituje semantyczny HTML bez skutków ubocznych."
        en: "The best renderer is boring-it consumes ready data, uses safe helpers and emits semantic HTML without side effects."
