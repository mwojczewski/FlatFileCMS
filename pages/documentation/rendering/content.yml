  - id: 01a06d50-5005-7504-8504-000000000004
    type: article-content
    enabled: true
    data:
      anchor: zadanie
      content:
        pl: |-
          ## 1. Zacznij od publicznego żądania

          Front controller przekazuje żądanie do SiteController. Kontroler nie zgaduje języka na podstawie nagłówka przeglądarki. Normalizuje ścieżkę, a następnie rozpoznaje prefiks spośród języków włączonych w konfiguracji.

          W instalacji wielojęzycznej pusta ścieżka przekierowuje do korzenia domyślnego locale, na przykład /pl/. Jeżeli pierwszy segment nie jest aktywnym językiem, kontroler zachowuje resztę ścieżki i dodaje domyślny prefiks. Kanoniczna postać URL-a jest jednoznaczna, a renderer zawsze pracuje z konkretnym locale.

          Repozytoria wczytują strony i kolekcje, a PageRouteIndex buduje wynikowe trasy z lokalizowanych slugów całego łańcucha przodków. Kontroler szuka najpierw strony. Dopiero gdy strona nie pasuje, próbuje rozpoznać kolekcję. Brak aktywnego zasobu kończy się 404, zanim powstanie HTML treści.

          ## 2. Zbuduj kompletny kontekst przed renderowaniem

          Jedno żądanie korzysta ze spójnego obrazu treści: listy stron, kolekcji, indeksu tras, konfiguracji witryny i nawigacji dla locale. Renderer nie wykonuje własnego routingu ani nie wyszukuje sąsiadów w systemie plików.

          Rozdzielenie ułatwia testy. Trasy sprawdzisz na modelach domenowych, fabrykę ViewModel na stronie i locale, a renderer na gotowych danych. Błędu publicznego adresu nie naprawiaj w render.php - tam tożsamość jest już rozstrzygnięta.
        en: |-
          ## 1. Start at the public request

          The front controller passes the request to SiteController. The controller does not guess language from a browser header. It normalizes the path, then resolves its prefix against the languages enabled in configuration.

          In a multilingual installation, an empty path redirects to the default locale root, for example /en/. If the first segment is not an enabled language, the controller preserves the remaining path and adds the default prefix. The canonical URL shape is unambiguous and the renderer always operates with a concrete locale.

          Repositories load pages and collections, while PageRouteIndex builds derived routes from localized slugs across the complete ancestor chain. The controller looks for a page first. Only when no page matches does it attempt a collection. An absent enabled resource produces 404 before content HTML is created.

          ## 2. Build the complete context before rendering

          One request uses a consistent content snapshot: pages, collections, route index, site configuration and locale-specific navigation. A renderer performs neither routing nor ad hoc filesystem searches for neighboring resources.

          This makes tests focused. Test routes on domain models, the ViewModel factory on a page and locale, and renderers on prepared data. Never repair a public-address defect inside render.php-identity has already been resolved there.
      note:
        pl: "Gdy URL jest błędny, zacznij od konfiguracji locale, slugów przodków i indeksu tras - nie od HTML-a komponentu."
        en: "When a URL is wrong, start with locale configuration, ancestor slugs and the route index-not component HTML."
  - id: 01a06d50-5005-7505-8505-000000000005
    type: article-content
    enabled: true
    data:
      anchor: model-widoku
      content:
        pl: |-
          ## 3. Traktuj PageViewModel jako granicę prezentacji

          PageViewModelFactory zamienia model strony na niezmienny zestaw danych potrzebny prezentacji. Wyznacza URL, wybiera layout strony lub domyślny, lokalizuje tytuł i SEO, przetwarza bloki oraz wzbogaca odwołania do mediów.

          PageViewModel zawiera id, locale, url, layout, title, seo, blocks i localizedUrls. Ostatnia mapa powstaje dla wszystkich aktywnych języków i pozwala przełącznikowi języka prowadzić do odpowiednika bieżącej strony. Metoda toArray celowo udostępnia kontrakt API bez technicznej mapy przełącznika.

          SSR i REST API są dwoma adapterami nad tym samym modelem. HTML nie odpytuje endpointu JSON przez HTTP, a endpoint nie parsuje HTML-a. Oba wejścia używają wspólnych repozytoriów i fabryki ViewModel, dlatego fallback tłumaczeń, media i kolejność bloków są zgodne.

          ## 4. Lokalizuj przed wejściem do szablonu

          Wartości wielojęzyczne są rozstrzygane zgodnie z locale i fallbackiem podczas budowania modelu widoku. Renderer powinien dostać tekst do wyświetlenia, a nie mapę języków wymagającą kolejnej decyzji.

          Komponent nie zna listy języków ani języka domyślnego. Ten sam render.php obsługuje każde locale, a reguły tłumaczeń nie rozchodzą się po templatkach. Wyjątkiem są pola techniczne zdefiniowane przez kontrakt jako nielokalizowane.
        en: |-
          ## 3. Treat PageViewModel as the presentation boundary

          PageViewModelFactory turns a page model into an immutable presentation data set. It determines the URL, selects the page or default layout, localizes title and SEO, processes blocks and enriches media references.

          PageViewModel contains id, locale, url, layout, title, seo, blocks and localizedUrls. The final map is created for every enabled language and lets the language switcher target the current page's equivalent. The toArray method deliberately exposes the API contract without this technical switcher map.

          SSR and REST API are two adapters over one model. HTML does not request JSON over HTTP, and the endpoint does not parse HTML. Both use shared repositories and the ViewModel factory, keeping translation fallback, media and block order consistent.

          ## 4. Localize before entering the template

          Multilingual values are resolved using locale and fallback rules while building the view model. A renderer should receive display text, not a language map requiring another decision.

          A component knows neither the language list nor its default. The same render.php supports every locale, and translation rules do not spread across templates. Technical fields explicitly declared non-localized by the contract are the exception.
      note:
        pl: "Jeśli SSR i API pokazują inne dane, szukaj obejścia wspólnej fabryki ViewModel albo dodatkowej transformacji w jednym adapterze."
        en: "If SSR and API expose different data, look for a bypass of the shared ViewModel factory or an extra transformation in one adapter."
  - id: 01a06d50-5005-7506-8506-000000000006
    type: article-content
    enabled: true
    data:
      anchor: bloki
      content:
        pl: |-
          ## 5. Przetwarzaj blok przed wywołaniem renderera

          Lista blocks zachowuje kolejność z content.yml. BlockProcessor rozpoznaje definicję typu, waliduje instancję, stosuje wartości domyślne, rozwiązuje pola lokalizowane i wzbogaca media. Publicznie renderowane są tylko bloki włączone oraz dopuszczone przez kontrakt.

          BlockRenderer dołącza właściwy plik PHP w kontrolowanym buforze wyjścia. Udostępnia tylko dwie zmienne: data i context. Wszystko wypisane przez szablon zostaje przechwycone jako fragment HTML. Wyjątek przerywa renderowanie zamiast oddać częściowy dokument.

          ~~~php
          <?php
          /** @var array<string, mixed> $data */
          /** @var \FlatFileCms\Rendering\RenderContext $context */
          ?>
          <section class="feature">
              <h2><?= $context->escape((string) ($data['title'] ?? '')) ?></h2>
              <div><?= $context->markdown((string) ($data['content'] ?? '')) ?></div>
          </section>
          ~~~

          Tekst zwykły przepuszczaj przez escape, a markdown tylko przez pola z takim kontraktem. Nie sklejaj atrybutów z niezweryfikowanych danych i nie pobieraj usług z globalnego kontenera.

          ## 6. Złóż bloki w layoucie

          PageRenderer tworzy jeden RenderContext, zbiera assety użytych typów, renderuje instancje po kolei do ciągu content i przekazuje go do LayoutRenderer. Wiele instancji typu daje wiele fragmentów HTML, lecz jego style.css i script.js są dodawane tylko raz.

          LayoutRegistry akceptuje zwykłe, niesymlinkowane pliki PHP o bezpiecznej nazwie w templates/layouts. Pole layout nie jest dowolną ścieżką, więc nie może wskazać pliku poza rejestrem.

          Layout otrzymuje page, seo, content, navigation, assets i context. Tworzy doctype, head, wspólny nagłówek i stopkę oraz osadza gotową treść. Nie powinien ponownie lokalizować bloków ani czytać YAML-a.
        en: |-
          ## 5. Process a block before invoking its renderer

          The blocks list preserves content.yml order. BlockProcessor resolves the type definition, validates the instance, applies defaults, resolves localized fields and enriches media. Only enabled blocks permitted by the contract reach public rendering.

          BlockRenderer includes the relevant PHP file inside a controlled output buffer. It exposes only two variables: data and context. Everything emitted by the template is captured as an HTML fragment. An exception aborts rendering rather than returning a partial document.

          ~~~php
          <?php
          /** @var array<string, mixed> $data */
          /** @var \FlatFileCms\Rendering\RenderContext $context */
          ?>
          <section class="feature">
              <h2><?= $context->escape((string) ($data['title'] ?? '')) ?></h2>
              <div><?= $context->markdown((string) ($data['content'] ?? '')) ?></div>
          </section>
          ~~~

          Pass plain text through escape and use markdown only for fields with that contract. Do not concatenate attributes from unvalidated data or obtain services from a global container.

          ## 6. Assemble blocks in a layout

          PageRenderer creates one RenderContext, collects assets for used types, renders instances in order into content and passes it to LayoutRenderer. Many instances create many HTML fragments, but their type's style.css and script.js are included only once.

          LayoutRegistry accepts regular, non-symlinked PHP files with safe names from templates/layouts. The layout field is not an arbitrary path and cannot point outside this registry.

          A layout receives page, seo, content, navigation, assets and context. It creates doctype, head, shared header and footer, and embeds ready content. It should neither localize blocks again nor read YAML.
      note:
        pl: "Layout odpowiada za dokument, partial za współdzielony fragment, a blok za edytowalny komponent treści."
        en: "A layout owns the document, a partial owns a shared fragment, and a block owns an editable content component."
  - id: 01a06d50-5005-7507-8507-000000000007
    type: code-showcase
    enabled: true
    data:
      eyebrow:
        pl: "Layout PHP"
        en: "PHP layout"
      title:
        pl: "Layout składa dokument bez ponownego przetwarzania treści."
        en: "A layout composes the document without reprocessing content."
      description:
        pl: "content zawiera wyrenderowane bloki, a assets - publiczne adresy zasobów wymaganych przez użyte typy."
        en: "content contains rendered blocks, while assets contains public resource URLs required by used types."
      filename: templates/layouts/default.php
      code: |-
        <!doctype html>
        <html lang="<?= $context->escape($page->locale) ?>">
        <head>
            <meta charset="utf-8">
            <title><?= $context->escape($seo['title'] ?? $page->title) ?></title>
            <?php foreach ($assets->styles as $href): ?>
                <link rel="stylesheet" href="<?= $context->asset($href) ?>">
            <?php endforeach; ?>
        </head>
        <body>
            <?= $context->partial('header', [
                'navigation' => $navigation,
                'localizedUrls' => $page->localizedUrls,
            ]) ?>
            <main><?= $content ?></main>
        </body>
        </html>
      bullets:
        - text:
            pl: "content jest zaufanym wynikiem rendererów i nie wymaga ponownego escape."
            en: "content is trusted renderer output and must not be escaped again."
        - text:
            pl: "Zwykłe wartości atrybutów nadal przechodzą przez bezpieczny helper."
            en: "Plain attribute values still pass through a safe helper."
        - text:
            pl: "Partial otrzymuje jawne dane zamiast kontenera aplikacji."
            en: "A partial receives explicit data instead of the application container."
