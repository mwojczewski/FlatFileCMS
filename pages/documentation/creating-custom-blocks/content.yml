          cell_2: { pl: Sformatowany string, en: Formatted string }
          cell_3: { pl: Ścisły format, en: Strict format }
          cell_4: { pl: Linki i dane kontaktowe, en: Links and contact data }
        - cell_1: { pl: date / datetime / color, en: date / datetime / color }
          cell_2: { pl: Sformatowany string, en: Formatted string }
          cell_3: { pl: Kalendarz lub wzorzec, en: Calendar or pattern }
          cell_4: { pl: Metadane prezentacyjne, en: Presentation metadata }
        - cell_1: { pl: image / file, en: image / file }
          cell_2: { pl: Mapa z src, en: Mapping with src }
          cell_3: { pl: Bezpieczna ścieżka i istnienie, en: Safe path and existence }
          cell_4: { pl: Media lokalne strony, en: Page-local media }
        - cell_1: { pl: repeater, en: repeater }
          cell_2: { pl: Lista map, en: List of mappings }
          cell_3: { pl: fields i limity elementów, en: fields and item limits }
          cell_4: { pl: Powtarzalne struktury, en: Repeatable structures }
  - id: 01a06830-3003-7409-8409-000000000009
    type: article-content
    enabled: true
    data:
      anchor: lokalizacja
      content:
        pl: |-
          ## 6. Modeluj tłumaczenia jako część typu

          `translatable: true` zmienia kształt przechowywanej wartości. Zamiast stringa pole zawiera mapę locale:

          ```yaml
          title:
            pl: Szybki rendering
            en: Fast rendering
          ```

          Dla pola wymaganego poprawna, niepusta wartość musi istnieć we wszystkich aktywnych językach. Pole opcjonalne może pominąć tłumaczenie; publiczna projekcja użyje wtedy wartości języka domyślnego jako fallbacku. Klucze języków spoza `config/languages.yml` są odrzucane.

          Nie ustawiaj `translatable: true` mechanicznie. Warto tłumaczyć tekst czy URL zależny od locale, ale wariant koloru, liczbowy limit, flaga logiczna lub lista technicznych opcji zwykle powinny pozostać wspólne. Każda dodatkowa oś tłumaczenia zwiększa liczbę wartości wymagających utrzymania.

          ## 7. Buduj repeatery rekurencyjnie

          Repeater przechowuje uporządkowaną listę elementów. Sam repeater zwykle ma `translatable: false`, natomiast jego pola tekstowe mogą być tłumaczalne:

          ```yaml
          items:
            - label:
                pl: Walidacja przed zapisem
                en: Validation before write
            - label:
                pl: Atomowa publikacja
                en: Atomic publication
          ```

          `minItems` i `maxItems` ograniczają długość listy. Każdy element musi być mapą, a jego klucze są sprawdzane względem zagnieżdżonego `fields`. Ścieżka błędu zachowuje indeks, np. `data.items.0.label.en`, dzięki czemu Page Builder może przypisać komunikat do konkretnej kontrolki.

          Schematy z wieloma poziomami są technicznie możliwe, ale projektuj je oszczędnie. Jeśli redaktor musi poruszać się po trzech zagnieżdżonych listach, komponent prawdopodobnie łączy kilka różnych odpowiedzialności i powinien zostać rozbity.
        en: |-
          ## 6. Model translations as part of the type

          `translatable: true` changes the stored value shape. Instead of a string, the field contains a locale mapping:

          ```yaml
          title:
            pl: Szybki rendering
            en: Fast rendering
          ```

          A required field needs a valid non-empty value for every enabled language. An optional field may omit a translation; the public projection then falls back to the default-language value. Language keys absent from `config/languages.yml` are rejected.

          Do not set `translatable: true` mechanically. Text and locale-specific URLs benefit from translation, while a color variant, numeric limit, boolean flag or list of technical options should usually remain shared. Every extra translation axis increases the number of values requiring maintenance.

          ## 7. Build repeaters recursively

          A repeater stores an ordered list of items. The repeater itself is usually `translatable: false`, while its text fields can be translatable:

          ```yaml
          items:
            - label:
                pl: Walidacja przed zapisem
                en: Validation before write
            - label:
                pl: Atomowa publikacja
                en: Atomic publication
          ```

          `minItems` and `maxItems` constrain list length. Every item must be a mapping, and its keys are checked against nested `fields`. The error path retains the index, for example `data.items.0.label.en`, allowing Page Builder to assign the message to the exact control.

          Deep schemas are technically possible, but design them sparingly. If an editor has to navigate three nested lists, the component probably combines several responsibilities and should be split.
      note:
        pl: Tłumaczenie jest regułą kontraktu, nie dekoracją panelu. Renderer otrzymuje już wartość wybraną dla bieżącego locale.
        en: Translation is a contract rule, not admin-panel decoration. The renderer receives a value already selected for the active locale.
  - id: 01a06830-3003-7410-8410-000000000010
    type: article-content
    enabled: true
    data:
      anchor: renderer
      content:
        pl: |-
          ## 8. Renderuj wyłącznie dane po walidacji

          `render.php` jest zaufanym kodem deweloperskim wymaganym przez `BlockRenderer`. W momencie jego wykonania `$data` zawiera dane zwalidowane, znormalizowane i zlokalizowane przez `BlockProcessor`. Renderer nie powinien ponownie interpretować surowego YAML ani rozwiązywać języka.

          ```php
          <?php

          declare(strict_types=1);

          $tone = $data['tone'];
          ?>
          <section class="feature-card feature-card--<?= $context->escape($tone) ?>">
              <div class="container">
                  <h2><?= $context->escape($data['title']) ?></h2>
                  <ul>
                      <?php foreach ($data['items'] as $item): ?>
                          <li><?= $context->escape($item['label']) ?></li>
                      <?php endforeach; ?>
                  </ul>
              </div>
          </section>
          ```

          `escape()` stosuj do zwykłego tekstu i wartości atrybutów. `markdown()` jest jedyną właściwą drogą dla pola Markdown: używa CommonMark, usuwa surowy HTML i blokuje niebezpieczne odnośniki. Nie wykonuj własnego `echo $data[...]` dla treści użytkownika i nie traktuj Markdown jako zaufanego HTML.

          `url()` waliduje adres przed umieszczeniem go w `href`. `asset()` przyjmuje wyłącznie bezwzględną ścieżkę root-relative do zasobu. `image()`, `imageUrl()` oraz `picture()` pracują na znormalizowanej mapie obrazu i kontekście bieżącej strony. `locale()` zwraca aktywny język, a `partial()` renderuje tylko nazwany partial odkryty przez stały rejestr.

          Kontekst celowo nie udostępnia kontenera DI, PDO, sesji, requestu, filesystemu, SMTP ani sekretów. Renderer ma być deterministyczną projekcją danych komponentu do HTML, a nie drugim kontrolerem.

          ## 9. Nie duplikuj logiki lokalizacji

          Jeżeli `title` jest tłumaczalny, `$data['title']` w rendererze jest już stringiem dla bieżącego locale — nie mapą z `pl` i `en`. To samo dotyczy tłumaczalnych pól wewnątrz repeatera oraz `alt` obrazu. Kod `$data['title'][$context->locale()]` byłby więc błędem warstwy.
        en: |-
          ## 8. Render only validated data

          `render.php` is trusted developer code required by `BlockRenderer`. When it runs, `$data` contains data validated, normalized and localized by `BlockProcessor`. The renderer should not reinterpret raw YAML or resolve the language again.

          ```php
          <?php

          declare(strict_types=1);

          $tone = $data['tone'];
          ?>
          <section class="feature-card feature-card--<?= $context->escape($tone) ?>">
              <div class="container">
                  <h2><?= $context->escape($data['title']) ?></h2>
                  <ul>
                      <?php foreach ($data['items'] as $item): ?>
                          <li><?= $context->escape($item['label']) ?></li>
                      <?php endforeach; ?>
                  </ul>
              </div>
          </section>
          ```

          Use `escape()` for plain text and attribute values. `markdown()` is the only correct route for a Markdown field: it uses CommonMark, strips raw HTML and blocks unsafe links. Never directly `echo $data[...]` for user content, and do not treat Markdown as trusted HTML.

          `url()` validates an address before placing it in `href`. `asset()` accepts only an absolute root-relative asset path. `image()`, `imageUrl()` and `picture()` operate on a normalized image mapping and current-page context. `locale()` returns the active language, and `partial()` renders only a named partial discovered through a fixed registry.

          The context deliberately exposes no DI container, PDO, session, request, filesystem, SMTP or secrets. A renderer should be a deterministic projection from component data to HTML, not a second controller.

          ## 9. Do not duplicate localization logic

          If `title` is translatable, `$data['title']` in the renderer is already a string for the active locale — not a `pl`/`en` mapping. The same applies to translatable repeater fields and image `alt`. Code such as `$data['title'][$context->locale()]` therefore violates the layer contract.
      note:
        pl: Walidacja danych nie zastępuje kodowania kontekstowego. Poprawny string nadal musi przejść przez `escape()`, `url()` albo właściwy helper mediów.
        en: Data validation does not replace contextual encoding. A valid string must still pass through `escape()`, `url()` or the appropriate media helper.
  - id: 01a06830-3003-7411-8411-000000000011
    type: article-content
    enabled: true
    data:
      anchor: media-assets
      content:
        pl: |-
          ## 10. Odwołuj się do mediów lokalnych strony

          Pole `image` przechowuje mapę z `src` i opcjonalnym, lokalizowanym `alt`:

          ```yaml
          image:
            src: architecture.png
            alt:
              pl: Schemat pipeline’u renderowania
              en: Rendering pipeline diagram
          ```

          `src` jest nazwą pliku w katalogu konkretnej strony, nie ścieżką `pages/...`, URL-em ani ścieżką absolutną. Walidator odrzuca wyjście poza katalog, pliki ukryte, `content.yml`, nieobsługiwane rozszerzenie obrazu oraz brak fizycznego pliku. Pole `file` działa podobnie, ale nie ogranicza referencji do rozszerzeń graficznych.

          Najprostszy renderer używa `<?= $context->image($data['image']) ?>`. Możesz przekazać wymiary, format, tryb `contain` lub `cover` i bezpieczną allowlistę atrybutów. Dla obrazu responsywnego użyj `picture()`:

          ```php
          <?= $context->picture(
              $data['image'],
              [480, 768, 1200],
              'webp',
              16 / 9,
              'cover',
              '(max-width: 720px) 100vw, 1200px',
              ['class' => 'feature-card__image'],
          ) ?>
          ```

          Tryb `cover` wymaga dodatniego aspect ratio, a warianty przyjmują wymiary od 1 do 8192 pikseli. Helper generuje `<picture>`, `srcset`, fallback, ALT oraz wymiary ograniczające layout shift.

          ## 11. Publikuj CSS i JavaScript warunkowo

          `AssetCollector` sprawdza wyłącznie `style.css` i `script.js`. Dany typ jest przetwarzany raz, nawet jeśli strona ma kilka jego instancji. Jeśli blok nie występuje w publicznym zestawie strony, jego zasoby nie są dodawane do HTML.

          Źródło musi być zwykłym plikiem mniejszym niż 1 MiB; symlinki są odrzucane. `AssetPublisher` liczy SHA-256 zawartości i publikuje kopię pod adresem podobnym do `/assets/blocks/feature-card/feature-card.a1b2c3d4e5f67890.css`. Zmiana bajtu tworzy nowy URL, dlatego plik może otrzymać długi cache HTTP bez ryzyka serwowania starej wersji.

          PHP potrzebuje zapisu do `public/assets/blocks/`. W aktualnym kodzie nowy publiczny katalog typu otrzymuje `0755`, a plik assetu `0644`, aby proces serwera WWW mógł go odczytać również wtedy, gdy działa jako inny użytkownik niż PHP-FPM.

          JavaScript powinien działać progresywnie, obsługiwać wiele instancji i nie zakładać, że blok istnieje:

          ```js
          document.querySelectorAll('.feature-card').forEach((block) => {
            block.dataset.ready = 'true';
          });
          ```
        en: |-
          ## 10. Reference page-local media

          An `image` field stores a mapping with `src` and optional localized `alt`:

          ```yaml
          image:
            src: architecture.png
            alt:
              pl: Schemat pipeline’u renderowania
              en: Rendering pipeline diagram
          ```

          `src` is a filename in the particular page directory, not a `pages/...` path, URL or absolute path. Validation rejects directory traversal, hidden files, `content.yml`, unsupported image extensions and a missing physical file. A `file` field behaves similarly without restricting the reference to image extensions.

          The simplest renderer uses `<?= $context->image($data['image']) ?>`. You can pass dimensions, format, `contain` or `cover` fit and an allowlisted set of attributes. Use `picture()` for a responsive image:

          ```php
          <?= $context->picture(
              $data['image'],
              [480, 768, 1200],
              'webp',
              16 / 9,
              'cover',
              '(max-width: 720px) 100vw, 1200px',
              ['class' => 'feature-card__image'],
          ) ?>
          ```

          `cover` requires a positive aspect ratio, and variant dimensions range from 1 to 8192 pixels. The helper generates `<picture>`, `srcset`, a fallback, ALT and dimensions that reduce layout shift.

          ## 11. Publish CSS and JavaScript conditionally

          `AssetCollector` checks only `style.css` and `script.js`. A type is processed once, even when a page contains several instances. If a block is absent from the page's public block set, its assets are not added to HTML.

          A source must be a regular file smaller than 1 MiB; symlinks are rejected. `AssetPublisher` hashes contents with SHA-256 and publishes a copy at a URL such as `/assets/blocks/feature-card/feature-card.a1b2c3d4e5f67890.css`. Changing one byte creates a new URL, allowing a long HTTP cache without serving an obsolete version.

          PHP needs write access to `public/assets/blocks/`. In the current code, a new public type directory receives `0755` and an asset file `0644`, allowing the web-server process to read it even when it runs as a different user from PHP-FPM.

          JavaScript should enhance progressively, support multiple instances and never assume that a block exists:

          ```js
          document.querySelectorAll('.feature-card').forEach((block) => {
            block.dataset.ready = 'true';
          });
          ```
      note:
        pl: "`blocks/<type>/style.css` jest źródłem deweloperskim. `public/assets/blocks/...` zawiera wygenerowaną, odtwarzalną kopię runtime i nie powinien być edytowany ręcznie."
        en: "`blocks/<type>/style.css` is developer source. `public/assets/blocks/...` contains a generated reproducible runtime copy and should not be edited manually."
  - id: 01a06830-3003-7412-8412-000000000012
    type: article-content
    enabled: true
    data:
      anchor: instancja
      content:
        pl: |-
          ## 12. Dodaj instancję do strony

          Instancja w `content.yml` ma cztery dozwolone właściwości:

          ```yaml
          blocks:
            - id: 01994d31-4fd1-7f32-9c2a-e89d624cda37
              type: feature-card
              enabled: true
              data:
                title:
                  pl: Bezpieczne zapisy
                  en: Safe writes
                tone: mint
                items:
                  - label:
                      pl: Rewizje SHA-256
                      en: SHA-256 revisions
          ```

          `id` musi być UUID v7 zapisanym małymi znakami i unikalnym na stronie. `type` wskazuje nazwę katalogu pakietu. `enabled` kontroluje publikację, a `data` musi dokładnie odpowiadać `fields`. Nie dodawaj komentarzy konfiguracyjnych jako dodatkowych kluczy bloku — nieznane właściwości są odrzucane.

          Blok wyłączony nadal podlega pełnej walidacji, lecz jest pomijany w publicznym HTML i API. Dzięki temu ukrycie komponentu nie staje się sposobem na przechowywanie danych niezgodnych z bieżącym kontraktem.

          ## 13. Używaj Page Buildera jako klienta schematu

          Po dodaniu pakietu pojawia się on automatycznie w pickerze `/admin/pages/builder?path=<identity>`. Formularz nie jest zapisany w bloku — `BlockFormRenderer` buduje kontrolki na podstawie typów i reguł. Języki pochodzą z `config/languages.yml`, więc komponent nie zakłada na stałe pary PL/EN.

          Administrator może dodać, edytować, duplikować, włączać, wyłączać, przeciągać i usuwać instancje. Duplikowanie generuje nowy UUID v7. Formularze Markdown korzystają z lokalnego EasyMDE, a podgląd klienta jest sanitizowany niezależnie od serwerowego renderera CommonMark.

          Każdy formularz niesie rewizję SHA-256 `content.yml`. Zapis pobiera blokadę strony, ponownie odczytuje dokument i zwraca HTTP 409, jeśli ktoś zapisał nowszą wersję. Dopiero kompletna walidacja strony oraz wszystkich bloków poprzedza atomową zmianę pliku.

          `preview.webp`, jeśli istnieje, jest udostępniany wyłącznie przez uwierzytelniony endpoint przyjmujący typ bloku — panel nie przyjmuje dowolnej ścieżki pliku.
        en: |-
          ## 12. Add an instance to a page

          A `content.yml` instance has four allowed properties:

          ```yaml
          blocks:
            - id: 01994d31-4fd1-7f32-9c2a-e89d624cda37
              type: feature-card
              enabled: true
              data:
                title:
                  pl: Bezpieczne zapisy
                  en: Safe writes
                tone: mint
                items:
                  - label:
                      pl: Rewizje SHA-256
                      en: SHA-256 revisions
          ```

          `id` must be a lowercase UUID v7 unique within the page. `type` points to the package directory name. `enabled` controls publication, and `data` must match `fields` exactly. Do not add configuration comments as extra block keys: unknown properties are rejected.

          A disabled block is still fully validated but omitted from public HTML and API output. Hiding a component therefore cannot become a way to retain data that violates the current contract.

          ## 13. Use Page Builder as a schema client

          After adding the package, it appears automatically in the `/admin/pages/builder?path=<identity>` picker. The form is not hard-coded in the block: `BlockFormRenderer` builds controls from types and rules. Languages come from `config/languages.yml`, so the component does not assume a fixed PL/EN pair.

          An administrator can add, edit, duplicate, enable, disable, drag and delete instances. Duplication generates a new UUID v7. Markdown forms use the locally vendored EasyMDE, while client preview is sanitized independently from the server-side CommonMark renderer.

          Every form carries the SHA-256 revision of `content.yml`. A save locks the page, rereads the document and returns HTTP 409 if someone saved a newer version. Only complete validation of the page and every block precedes atomic file replacement.

          When present, `preview.webp` is served only through an authenticated endpoint receiving a block type; the panel never accepts an arbitrary file path.
      note:
        pl: Panel zarządza instancjami i treścią. Definicja, renderer oraz assety pozostają niezmiennie własnością dewelopera.
        en: The panel manages instances and content. The definition, renderer and assets remain developer-owned.
  - id: 01a06830-3003-7413-8413-000000000013
    type: article-content
    enabled: true
    data:
      anchor: testowanie
      content:
        pl: |-
          ## 14. Testuj kontrakt warstwowo

          Zacznij od kontroli całego projektu:

          ```bash
          composer check
          ```

          Pipeline uruchamia PHP CS Fixer, PHPStan i PHPUnit. Nowy renderer podlega regułom stylu oraz analizie typów, ale komponent wymaga też testów zachowania.

          Minimalny zestaw przypadków obejmuje:

          1. poprawne dane przechodzą normalizację;
          2. brak wymaganego pola zwraca błąd z właściwą ścieżką;
          3. nieznane pole jest odrzucane;
          4. brak tłumaczenia wymaganego pola jest odrzucany;
          5. wartości spoza `options` nie przechodzą;
          6. repeater respektuje oba limity i waliduje elementy;
          7. renderer koduje tekst zawierający `<`, `>`, `&` i cudzysłowy;
          8. Markdown nie przepuszcza surowego HTML ani niebezpiecznego schematu URL;
          9. asset występuje raz przy wielu instancjach typu;
          10. brak bloku oznacza brak jego CSS i JavaScriptu w dokumencie.

          Przed produkcją uruchom również:

          ```bash
          php bin/cms release:check
          ```

          Ta kontrola skanuje wszystkie strony i kolekcje, ładuje definicje, weryfikuje layouty oraz waliduje każdą instancję — także wyłączoną. Wydanie z `[FAIL]` nie jest gotowe do przełączenia ruchu.

          ## 15. Wdróż pakiet atomowo na poziomie wydania

          Repozytorium przechowuje `blocks/feature-card/`, lecz nie fingerprintowane kopie z `public/assets/blocks/`. Po wdrożeniu pierwsze renderowanie strony publikuje brakujące zasoby. Przy immutable deployment rozgrzej strony podczas budowania artefaktu i przenieś powstały katalog publicznych assetów razem z wydaniem.

          Po zmianie schematu sprawdź wszystkie istniejące instancje przed publikacją kodu. Najbezpieczniejsza kolejność dla zmiany niekompatybilnej to przygotowanie migracji YAML, wykonanie jej na kopii treści, uruchomienie `release:check`, a dopiero później przełączenie kompletnego wydania.
        en: |-
          ## 14. Test the contract in layers

          Begin with the complete project check:

          ```bash
          composer check
          ```

          The pipeline runs PHP CS Fixer, PHPStan and PHPUnit. A new renderer is subject to style rules and static analysis, but the component also needs behavioural tests.

          A minimum case set covers:

          1. valid data passes normalization;
          2. a missing required field returns an error at the correct path;
          3. an unknown field is rejected;
          4. a missing required translation is rejected;
          5. values outside `options` fail;
          6. a repeater respects both limits and validates its items;
          7. the renderer encodes text containing `<`, `>`, `&` and quotes;
          8. Markdown does not allow raw HTML or unsafe URL schemes;
          9. an asset appears once for multiple instances of a type;
          10. no block means no corresponding CSS or JavaScript in the document.

          Before production, also run:

          ```bash
          php bin/cms release:check
          ```

          This check scans every page and collection, loads definitions, verifies layouts and validates every instance — including disabled ones. A release containing `[FAIL]` is not ready to receive traffic.

          ## 15. Deploy the package atomically at release level

          The repository stores `blocks/feature-card/`, but not fingerprinted copies from `public/assets/blocks/`. After deployment, the first page render publishes missing assets. With an immutable deployment, warm the pages while building the artifact and move the resulting public asset directory with the release.

          After changing a schema, check all existing instances before publishing code. The safest order for an incompatible change is to prepare a YAML migration, run it against a content copy, execute `release:check`, and only then switch to the complete release.
      note:
        pl: Test samego `render.php` nie wystarcza. Najważniejsze błędy powstają na granicach schematu, lokalizacji, mediów i publikacji assetów.
        en: Testing `render.php` alone is insufficient. The most important failures occur at schema, localization, media and asset-publication boundaries.
  - id: 01a06830-3003-7414-8414-000000000014
    type: diagnostic-table
    enabled: true
    data:
      anchor: diagnostyka-bloku
      eyebrow:
        pl: 16 / Diagnostyka
        en: 16 / Troubleshooting
      title:
        pl: Znajdź warstwę, zanim zmienisz kod.
        en: Find the layer before changing code.
      intro:
        pl: Komunikat widoczny przy zapisie albo renderowaniu zwykle wskazuje granicę, która odrzuciła dane. Zacznij od kontraktu i ścieżki błędu.
        en: A message shown during saving or rendering usually identifies the boundary that rejected data. Begin with the contract and error path.
      rows:
        - layer: { pl: Registry, en: Registry }
          problem: { pl: Typ bloku nie pojawia się w pickerze, en: Block type does not appear in the picker }
          cause: { pl: "Niepoprawna nazwa katalogu, brak wymaganego pliku, symlink albo błędny schemat.", en: "Invalid directory name, missing required file, symlink or invalid schema." }
          check: { pl: "Sprawdź slug katalogu, zwykłe pliki `block.yml` i `render.php` oraz `schemaVersion: 1`.", en: "Check the directory slug, regular `block.yml` and `render.php` files, and `schemaVersion: 1`." }
        - layer: { pl: Schema, en: Schema }
          problem: { pl: Zapis zwraca UNKNOWN_FIELD, en: Save returns UNKNOWN_FIELD }
          cause: { pl: Dane zawierają klucz nieobecny w definicji lub stary klucz po refaktorze., en: Data contains a key absent from the definition or an old key left after refactoring. }
          check: { pl: Porównaj dokładnie `data` z `fields`; usuń albo jawnie zmigruj stary klucz., en: Compare `data` with `fields` exactly; remove or explicitly migrate the old key. }
        - layer: { pl: Lokalizacja, en: Localization }
          problem: { pl: Brak wymaganej translacji, en: Required translation is missing }
          cause: { pl: Pole tłumaczalne nie ma wartości dla jednego z aktywnych języków., en: A translatable field has no value for one of the enabled languages. }
          check: { pl: Sprawdź `config/languages.yml` oraz każdy wymagany mapping locale w instancji., en: Check `config/languages.yml` and every required locale mapping in the instance. }
        - layer: { pl: Media, en: Media }
          problem: { pl: MEDIA_NOT_FOUND, en: MEDIA_NOT_FOUND }
          cause: { pl: "`src` nie wskazuje istniejącego pliku w katalogu bieżącej strony.", en: "`src` does not reference an existing file in the current page directory." }
          check: { pl: Umieść plik obok `content.yml` i zapisz samą bezpieczną nazwę względną., en: Place the file next to `content.yml` and store only its safe relative name. }
        - layer: { pl: Renderer, en: Renderer }
          problem: { pl: Błąd typu lub niezdefiniowany indeks, en: Type error or undefined index }
          cause: { pl: Kod renderera zakłada inne dane niż aktualny schemat lub nie obsługuje pola opcjonalnego., en: Renderer code assumes data different from the current schema or does not handle an optional field. }
          check: { pl: Zsynchronizuj renderer ze schematem i dla opcji stosuj `$data['field'] ?? wartość`., en: Synchronize renderer and schema; use `$data['field'] ?? value` for optional fields. }
        - layer: { pl: Assety, en: Assets }
          problem: { pl: CSS lub JS zwraca 403, en: CSS or JavaScript returns 403 }
          cause: { pl: Serwer WWW nie może przejść przez katalog publicznego assetu lub odczytać `.htaccess`., en: The web server cannot traverse the public asset directory or read `.htaccess`. }
          check: { pl: "Sprawdź pełne `namei -l`, katalogi `0755`, pliki `0644` oraz log Apache.", en: "Check full `namei -l`, `0755` directories, `0644` files and the Apache error log." }
        - layer: { pl: Współbieżność, en: Concurrency }
          problem: { pl: Page Builder zwraca HTTP 409, en: Page Builder returns HTTP 409 }
          cause: { pl: Formularz zawiera starszą rewizję niż aktualny `content.yml`., en: The form contains an older revision than the current `content.yml`. }
          check: { pl: "Odśwież stronę, ponownie zastosuj zmianę i zapisz na aktualnej rewizji.", en: "Refresh the page, reapply the change and save against the current revision." }
      note:
        pl: Nie obchodź walidatora przez ręczne osłabienie schematu. Najpierw ustal, czy błąd leży w definicji, instancji, pliku medium czy rendererze.
        en: Do not bypass validation by weakening the schema. First determine whether the fault belongs to the definition, instance, media file or renderer.
  - id: 01a06830-3003-7415-8415-000000000015
    type: article-content
    enabled: true
    data:
      anchor: checklista-bloku
      content:
        pl: |-
          ## 17. Checklista gotowego bloku

          Przed uznaniem komponentu za ukończony potwierdź:

          1. typ ma poprawny slug, a pakiet nie jest symlinkiem;
          2. `block.yml` i `render.php` są zwykłymi, czytelnymi plikami;
          3. każde pole ma precyzyjny typ, limit i świadomą decyzję o tłumaczeniu;
          4. required fields mają wartości we wszystkich aktywnych językach;
          5. renderer używa właściwego helpera dla każdego kontekstu;
          6. pola opcjonalne mają bezpieczne wartości domyślne;
          7. repeatery mają rozsądne `minItems` i `maxItems`;
          8. obrazy istnieją przy stronie i mają lokalizowany ALT;
          9. CSS działa bez globalnych selektorów kolidujących z layoutem;
          10. JavaScript obsługuje zero, jedną i wiele instancji;
          11. widok desktopowy i mobilny zachowują hierarchię oraz dostępność;
          12. `composer check` i `php bin/cms release:check` kończą się sukcesem.

          Gotowy blok jest małym, zamkniętym modułem: ma jawne wejście, walidację, bezpieczną projekcję HTML i zasoby ładowane na żądanie. Ta przewidywalność jest ważniejsza niż liczba opcji udostępnionych redaktorowi.
        en: |-
          ## 17. Finished-block checklist

          Before declaring the component complete, confirm that:

          1. the type has a valid slug and the package is not a symlink;
          2. `block.yml` and `render.php` are regular readable files;
          3. every field has a precise type, limit and deliberate translation decision;
          4. required fields have values in every enabled language;
          5. the renderer uses the correct helper for every context;
          6. optional fields have safe defaults;
          7. repeaters have reasonable `minItems` and `maxItems`;
          8. images exist beside the page and have localized ALT;
          9. CSS avoids global selectors that collide with the layout;
          10. JavaScript supports zero, one and many instances;
          11. desktop and mobile views preserve hierarchy and accessibility;
          12. `composer check` and `php bin/cms release:check` succeed.

          A finished block is a small closed module: it has explicit input, validation, a safe HTML projection and assets loaded on demand. That predictability matters more than the number of options exposed to an editor.
      note:
        pl: Jeśli kontraktu bloku nie da się wyjaśnić jednym zdaniem, prawdopodobnie warto podzielić komponent na dwa prostsze typy.
        en: If the block contract cannot be explained in one sentence, consider splitting the component into two simpler types.
