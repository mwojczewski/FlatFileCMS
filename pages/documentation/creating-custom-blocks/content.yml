  - id: 01a06830-3003-7404-8404-000000000004
    type: article-content
    enabled: true
    data:
      anchor: model-bloku
      content:
        pl: |-
          ## 1. Zrozum granicę systemu bloków

          Blok jest **pakietem kodu deweloperskiego**, a nie fragmentem treści tworzonym przez redaktora. Deweloper definiuje jego możliwości w `blocks/<type>/`; redaktor tworzy później instancje tego typu w Page Builderze i uzupełnia wyłącznie pola dopuszczone przez schemat.

          Ta granica jest celowa. Panel może zmienić tytuł, kolejność elementów albo wskazany obraz, ale nie może edytować PHP, CSS, JavaScriptu ani samego kontraktu. Kod wykonywalny trafia na serwer przez kontrolowany proces wdrożenia, natomiast treść może być aktualizowana bez deployu aplikacji.

          `BlockRegistry` przegląda bezpośrednie podkatalogi `blocks/`. Nazwa katalogu staje się typem bloku i musi być slugiem złożonym z małych znaków ASCII, cyfr oraz łączników, np. `feature-card` albo `pricing-table`. Rejestr pomija katalogi ukryte i dowiązania symboliczne. Sam katalog, `block.yml` oraz `render.php` muszą być zwykłymi plikami znajdującymi się pod stałym korzeniem bloków.

          Dodanie standardowego bloku nie wymaga dopisywania trasy, kontrolera, tabeli bazy, serializera API ani instrukcji warunkowej w jądrze. Rejestr odkrywa pakiet, Page Builder generuje formularz ze schematu, `BlockProcessor` waliduje dane, a adaptery HTML i JSON korzystają z tego samego znormalizowanego modelu.

          ## 2. Oddziel typ od instancji

          Katalog `blocks/feature-card/` opisuje **typ** dostępny w całej witrynie. Wpis w `pages/.../content.yml` jest **instancją** tego typu na konkretnej stronie. Jedna definicja może obsługiwać dowolną liczbę instancji, a każda ma własny UUID v7, stan `enabled` i dane.

          Zmiana `block.yml` wpływa na walidację wszystkich istniejących instancji. Usunięcie pola, zmiana jego typu lub oznaczenie go jako wymaganego może więc unieważnić wcześniej poprawne strony. Traktuj schemat jak publiczny kontrakt: zmiany niekompatybilne wymagają migracji treści w tym samym wydaniu.
        en: |-
          ## 1. Understand the block-system boundary

          A block is a **developer-owned code package**, not a piece of content authored by an editor. The developer defines its capabilities in `blocks/<type>/`; an editor later creates instances of that type in Page Builder and fills only the fields permitted by the schema.

          This boundary is deliberate. The panel may change a title, item order or selected image, but it cannot edit PHP, CSS, JavaScript or the contract itself. Executable code reaches the server through a controlled deployment process, while content can be updated without deploying the application.

          `BlockRegistry` scans direct subdirectories of `blocks/`. A directory name becomes the block type and must be a lowercase ASCII slug containing digits or hyphens, for example `feature-card` or `pricing-table`. The registry ignores hidden directories and symbolic links. The package directory, `block.yml` and `render.php` must be regular files under the fixed block root.

          Adding a standard block requires no route, controller, database table, API serializer or core conditional. The registry discovers the package, Page Builder generates a form from its schema, `BlockProcessor` validates data, and the HTML and JSON adapters use the same normalized model.

          ## 2. Separate a type from an instance

          The `blocks/feature-card/` directory describes a **type** available across the site. An entry in `pages/.../content.yml` is an **instance** of that type on a particular page. One definition can support any number of instances, each with its own UUID v7, `enabled` state and data.

          Changing `block.yml` affects validation of every existing instance. Removing a field, changing its type or making it required can invalidate previously correct pages. Treat the schema as a public contract: incompatible changes require a content migration in the same release.
      note:
        pl: Nie zapisuj logiki biznesowej w `content.yml`. YAML przechowuje dane instancji, a zachowanie komponentu należy do wersjonowanego pakietu bloku.
        en: Do not store business logic in `content.yml`. YAML stores instance data; component behaviour belongs to the versioned block package.
  - id: 01a06830-3003-7405-8405-000000000005
    type: article-content
    enabled: true
    data:
      anchor: scaffold
      content:
        pl: |-
          ## 3. Wygeneruj bezpieczny scaffold

          Najszybszy start zapewnia CLI:

          ```bash
          php bin/cms block:create feature-card --with-assets
          ```

          Bez `--with-assets` powstaną tylko obowiązkowe `block.yml` i `render.php`. Z opcją CLI doda również `style.css` oraz `script.js`. Polecenie odrzuci niepoprawny slug i istniejący katalog — nigdy celowo nie nadpisuje pakietu.

          Operacja jest odporna na częściowy zapis. `BlockScaffolder` zakłada blokadę na katalogu `blocks/`, tworzy prywatny katalog tymczasowy z losową nazwą, zapisuje do niego komplet plików, ustawia prawa i dopiero na końcu publikuje cały pakiet przez zmianę nazwy katalogu. Awaria po drugim pliku nie pozostawia półgotowego typu widocznego dla rejestru.

          Wygenerowana definicja zawiera tłumaczalny, wymagany `title` oraz opcjonalny `content` typu Markdown. Renderer bezpiecznie przekazuje tytuł do `escape()`, a treść do `markdown()`. Jest to działający punkt startowy, nie docelowy model domenowy komponentu.

          Po wygenerowaniu sprawdź strukturę:

          ```text
          blocks/feature-card/
          ├── block.yml
          ├── render.php
          ├── style.css
          └── script.js
          ```

          Pliki pakietu wersjonuj razem. Nie przesyłaj samego renderera bez odpowiadającego mu schematu — w czasie wdrożenia rejestr może wtedy odczytać kontrakt niezgodny z kodem.
        en: |-
          ## 3. Generate a safe scaffold

          The CLI provides the fastest start:

          ```bash
          php bin/cms block:create feature-card --with-assets
          ```

          Without `--with-assets`, only the required `block.yml` and `render.php` are created. With the option, the CLI also adds `style.css` and `script.js`. The command rejects an invalid slug and an existing directory; it never deliberately overwrites a package.

          The operation resists partial writes. `BlockScaffolder` locks the `blocks/` directory, creates a private randomly named temporary directory, writes the complete file set, assigns permissions and only then publishes the package by renaming the directory. A failure after the second file cannot leave a half-built type visible to the registry.

          The generated definition contains a translatable required `title` and optional Markdown `content`. The renderer safely passes the title to `escape()` and content to `markdown()`. This is a working starting point, not the component's final domain model.

          Inspect the generated structure:

          ```text
          blocks/feature-card/
          ├── block.yml
          ├── render.php
          ├── style.css
          └── script.js
          ```

          Version the package files together. Do not deploy the renderer without its matching schema: the registry could otherwise read a contract that does not match the code.
      note:
        pl: Scaffold tworzy pliki z bezpiecznymi wartościami początkowymi. Od tego momentu są zwykłym kodem źródłowym i podlegają przeglądowi, testom oraz wdrożeniu.
        en: The scaffold creates files with safe initial values. From then on they are ordinary source code subject to review, testing and deployment.
  - id: 01a06830-3003-7406-8406-000000000006
    type: code-showcase
    enabled: true
    data:
      eyebrow:
        pl: Zamknięty kontrakt danych
        en: Closed data contract
      title:
        pl: Schemat jest jednocześnie dokumentacją, walidatorem i formularzem.
        en: The schema is documentation, validator and form at once.
      description:
        pl: Przykładowa karta funkcji pokazuje pola tłumaczalne, wybór z allowlisty oraz repeater. Każdy klucz danych nieobecny w `fields` zostanie odrzucony.
        en: This feature-card example demonstrates translatable fields, an allowlisted choice and a repeater. Every data key absent from `fields` is rejected.
      filename: blocks/feature-card/block.yml
      code: |-
        schemaVersion: 1
        name:
          pl: Karta funkcji
          en: Feature card
        description:
          pl: Karta z listą korzyści.
          en: A card with a list of benefits.
        icon: star
        fields:
          title:
            type: text
            required: true
            translatable: true
            minLength: 1
            maxLength: 120
          tone:
            type: select
            required: true
            translatable: false
            options: [mint, violet, amber]
          items:
            type: repeater
            required: true
            translatable: false
            minItems: 1
            maxItems: 6
            fields:
              label:
                type: text
                required: true
                translatable: true
                maxLength: 100
      bullets:
        - text: { pl: "`schemaVersion: 1` jawnie wersjonuje format definicji.", en: "`schemaVersion: 1` explicitly versions the definition format." }
        - text: { pl: "`translatable` określa kształt wartości zapisanej w YAML.", en: "`translatable` determines the shape stored in YAML." }
        - text: { pl: "`options` jest allowlistą, a nie podpowiedzią interfejsu.", en: "`options` is an allowlist, not merely a UI suggestion." }
        - text: { pl: Repeater waliduje każdy element rekurencyjnie., en: The repeater validates every item recursively. }
  - id: 01a06830-3003-7407-8407-000000000007
    type: article-content
    enabled: true
    data:
      anchor: pola
      content:
        pl: |-
          ## 4. Zdefiniuj metadane i pola

          Główny dokument `block.yml` musi być mapą. `schemaVersion` ma obecnie wartość `1`. `name` i `description` są mapami językowymi używanymi w panelu, `icon` identyfikuje ikonę, a `fields` opisuje dopuszczalne dane instancji.

          Nazwa pola zaczyna się małą literą i może zawierać litery ASCII, cyfry oraz podkreślenia. Dobre nazwy opisują znaczenie (`heading`, `items`, `background_tone`), a nie pozycję w formularzu (`field_1`). Każda definicja pola zawiera `type`, `required` oraz `translatable`; dodatkowe reguły zależą od typu.

          Kontrakt jest zamknięty. Jeśli instancja zawiera `data.subtitle`, którego nie ma w `fields`, walidator zwróci `UNKNOWN_FIELD`. Dzięki temu literówka nie staje się cicho ignorowaną treścią, a usunięty element schematu nie pozostaje niewidzialnym balastem w YAML.

          ## 5. Dobierz typ do znaczenia danych

          `text`, `textarea` i `markdown` normalizują zakończenia linii i obsługują `minLength` oraz `maxLength` (także aliasy `min` i `max`). Różnią się kontrolką panelu oraz sposobem użycia: Markdown należy renderować przez `markdown()`, a zwykły tekst przez `escape()`.

          `number` przyjmuje liczbę całkowitą lub skończony float. Reguły `min`, `max` i `integer: true` zawężają zakres. Numeryczny string z formularza jest normalizowany, ale `NaN` i nieskończoność są odrzucane.

          `boolean` przechowuje wartość logiczną. `select` wymaga jednej wartości z `options` lub `allowedValues`; `multiselect` wymaga unikalnej listy wartości i może stosować `minItems` oraz `maxItems`. Opcje mogą być prostymi stringami albo obiektami `{value, label}`, gdy panel potrzebuje tłumaczalnych etykiet.

          `url` dopuszcza absolutne adresy HTTP(S) oraz adresy root-relative zaczynające się pojedynczym `/`. Odrzuca `//host`, protokoły skryptowe i przypadkowy tekst. `email`, `date`, `datetime` i `color` mają ścisłą walidację formatu. Data używa `YYYY-MM-DD`, datetime formatu `datetime-local` lub RFC 3339, a kolor postaci `#rrggbb` albo `#rrggbbaa` i jest normalizowany do małych liter.

          `image` oraz `file` są referencjami do pliku znajdującego się w katalogu bieżącej strony. Nie są dowolną ścieżką ani publicznym URL-em. `repeater` jest listą map i jako jedyny typ może deklarować własne zagnieżdżone `fields`.
        en: |-
          ## 4. Define metadata and fields

          The root `block.yml` document must be a mapping. `schemaVersion` is currently `1`. `name` and `description` are locale mappings used in the panel, `icon` identifies an icon, and `fields` describes permitted instance data.

          A field name starts with a lowercase letter and may contain ASCII letters, digits and underscores. Good names describe meaning (`heading`, `items`, `background_tone`), not form position (`field_1`). Every field definition contains `type`, `required` and `translatable`; further rules depend on the type.

          The contract is closed. If an instance contains `data.subtitle` absent from `fields`, validation returns `UNKNOWN_FIELD`. A typo therefore cannot become silently ignored content, and a removed schema element cannot remain invisible baggage in YAML.

          ## 5. Match the type to the meaning

          `text`, `textarea` and `markdown` normalize line endings and support `minLength` and `maxLength` (including `min` and `max` aliases). Their admin controls and usage differ: Markdown goes through `markdown()`, while plain text goes through `escape()`.

          `number` accepts an integer or finite float. `min`, `max` and `integer: true` narrow the range. A numeric form string is normalized, while `NaN` and infinity are rejected.

          `boolean` stores a logical value. `select` requires one value from `options` or `allowedValues`; `multiselect` requires a unique list and may use `minItems` and `maxItems`. Options can be plain strings or `{value, label}` objects when the panel needs translated labels.

          `url` permits absolute HTTP(S) URLs and root-relative addresses beginning with a single `/`. It rejects `//host`, script protocols and arbitrary text. `email`, `date`, `datetime` and `color` have strict format validation. A date uses `YYYY-MM-DD`, datetime uses a `datetime-local` or RFC 3339 form, and a color is `#rrggbb` or `#rrggbbaa`, normalized to lowercase.

          `image` and `file` reference a file in the current page directory. They are not arbitrary paths or public URLs. `repeater` is a list of mappings and is the only type allowed to declare nested `fields`.
      note:
        pl: Wybierz najbardziej precyzyjny typ. Pole `text` przechowujące URL lub datę omija walidację, którą silnik już oferuje.
        en: Choose the most precise type. A `text` field storing a URL or date bypasses validation already provided by the engine.
