    id: 01a06d50-4004-7404-8404-000000000004
    type: article-content
    enabled: true
    data:
      anchor: tozsamosc
      content:
        pl: |-
          ## 1. Zacznij od drzewa katalogów

          FlatFile CMS traktuje `pages/` jako korzeń modelu treści. Zwykła strona jest katalogiem zawierającym `content.yml`, a kolekcja — katalogiem zawierającym `pagination.yml`. W wersji kontraktu 1 jeden katalog nie może być jednocześnie stroną i kolekcją.

          ```text
          pages/
          ├── homepage/content.yml
          └── documentation/
              ├── pagination.yml
              ├── getting-started/content.yml
              ├── creating-custom-blocks/content.yml
              └── content-structure/content.yml
          ```

          Relatywna ścieżka katalogu jest stabilną tożsamością techniczną. `documentation/content-structure` identyfikuje stronę niezależnie od języka i publicznego URL-a. Segmenty muszą być małymi slugami ASCII. Tożsamość jest używana przez repozytoria, panel, blokady, media lokalne strony i linki wewnętrzne.

          Nie nazywaj katalogów według tymczasowej kampanii albo tłumaczenia wybranego języka. Dobra tożsamość opisuje trwałą rolę zasobu. Zmiana publicznego slugu nie wymaga zmiany katalogu; przeniesienie katalogu jest osobną operacją zmieniającą tożsamość całego poddrzewa.

          ## 2. Traktuj homepage jako przypadek specjalny

          `pages/homepage/content.yml` ma stałą tożsamość `homepage` i nie deklaruje `slug`. Jego publiczna ścieżka to korzeń danego locale. Homepage można edytować, ale panel nie pozwala go utworzyć ponownie, przenieść ani usunąć.

          Przy jednym aktywnym języku korzeń ma postać `/`. Przy kilku aktywnych językach powstają np. `/pl/` i `/en/`, a żądanie bez prefiksu jest przekierowywane do domyślnego locale.
        en: |-
          ## 1. Start with the directory tree

          FlatFile CMS treats `pages/` as the content-model root. A regular page is a directory containing `content.yml`; a collection contains `pagination.yml`. In contract version 1, one directory cannot be both a page and a collection.

          ```text
          pages/
          ├── homepage/content.yml
          └── documentation/
              ├── pagination.yml
              ├── getting-started/content.yml
              ├── creating-custom-blocks/content.yml
              └── content-structure/content.yml
          ```

          The relative directory path is the stable technical identity. `documentation/content-structure` identifies a page independently from language and public URL. Segments must be lowercase ASCII slugs. Repositories, the admin panel, locks, page-local media and internal links use this identity.

          Do not name directories after a temporary campaign or one language's translation. A good identity describes the resource's lasting role. Changing a public slug does not require renaming the directory; moving the directory is a separate operation that changes the identity of the complete subtree.

          ## 2. Treat the homepage as a special case

          `pages/homepage/content.yml` has the fixed `homepage` identity and declares no `slug`. Its public path is the root of each locale. The homepage can be edited, but the panel cannot recreate, move or delete it.

          With one enabled language the root is `/`. With several enabled languages, routes such as `/pl/` and `/en/` are created, and an unprefixed request is redirected to the default locale.
      note:
        pl: 'Nazwa katalogu jest kluczem systemowym. Slug jest częścią interfejsu publicznego. Nie używaj tych pojęć zamiennie.'
        en: 'A directory name is a system key. A slug is part of the public interface. Do not use these terms interchangeably.'
