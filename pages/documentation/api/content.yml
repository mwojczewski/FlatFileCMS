            pl: "Porównaj query z pagination.yml i zakoduj wartości URL."
            en: "Compare query with pagination.yml and URL-encode values."
        - layer:
            pl: Cache
            en: Cache
          problem:
            pl: "304 prowadzi do pustego ekranu"
            en: "304 produces a blank screen"
          cause:
            pl: "Klient potraktował puste body jako nową treść."
            en: "Client treated the empty body as new content."
          check:
            pl: "Po 304 użyj zachowanego body powiązanego z wysłanym ETag."
            en: "After 304 use stored body associated with the sent ETag."
        - layer:
            pl: Przeglądarka
            en: Browser
          problem:
            pl: "Fetch blokowany mimo odpowiedzi curl"
            en: "Fetch blocked despite a successful curl"
          cause:
            pl: "Brak polityki CORS dla innego originu."
            en: "No CORS policy for a different origin."
          check:
            pl: "Sprawdź konsolę i nagłówki; skonfiguruj wąską allowlistę originów."
            en: "Inspect console and headers; configure a narrow origin allowlist."
        - layer:
            pl: Komponent
            en: Component
          problem:
            pl: "JSON działa, lecz bloku nie widać"
            en: "JSON works but a block is absent"
          cause:
            pl: "Klient nie ma renderera dla type albo blok jest disabled."
            en: "Client lacks a renderer for type or block is disabled."
          check:
            pl: "Porównaj type z registry klienta i publiczną tablicą blocks."
            en: "Compare type with the client registry and public blocks array."
      note:
        pl: "Zapisuj nagłówki odpowiedzi razem ze statusem. Bez ETag, Last-Modified i Content-Type diagnoza cache oraz wariantu odpowiedzi jest niepełna."
        en: "Record response headers with status. Without ETag, Last-Modified and Content-Type, cache and representation diagnosis is incomplete."
  - id: 01a06d50-6006-7615-8615-000000000015
    type: article-content
    enabled: true
    data:
      anchor: checklista-api
      content:
        pl: |-
          ## 23. Checklista integracji gotowej do produkcji

          Przed uruchomieniem klienta potwierdź:

          1. base URL używa HTTPS i zaufanego certyfikatu;
          2. ścieżki API nie zawierają prefiksu locale;
          3. lang pochodzi z aktywnej listy języków;
          4. klient rozróżnia transport, success JSON i error JSON;
          5. switch błędów używa code, nie message;
          6. każdy używany type bloku ma jawny renderer i fallback;
          7. tekst jest bezpiecznie renderowany w docelowym frameworku;
          8. media korzystają z gotowego url, width i height;
          9. filtry kolekcji są URL-encoded i zgodne z allowlistą;
          10. cache key uwzględnia endpoint, query oraz locale;
          11. ETag i body są zapisywane atomowo jako para;
          12. 304 zachowuje poprzednie body;
          13. retry dotyczy tylko bezpiecznych błędów przejściowych i ma limit;
          14. CORS jest skonfigurowany tylko wtedy, gdy naprawdę jest potrzebny;
          15. klient toleruje dodatkowe pola kompatybilnej wersji;
          16. testy kontraktowe korzystają z aktualnego openapi.json;
          17. smoke test obejmuje PL, EN, kolekcję, media, błędy i rewalidację.

          API pozostaje małe, ponieważ udostępnia gotowy model prezentacyjny zamiast szczegółów systemu plików. Klient jest odporny wtedy, gdy respektuje tę granicę, traktuje HTTP jako protokół z semantyką i jawnie mapuje dynamiczne bloki.
        en: |-
          ## 23. Production-ready integration checklist

          Before launching a client, confirm that:

          1. base URL uses HTTPS and a trusted certificate;
          2. API paths contain no locale prefix;
          3. lang comes from the enabled language list;
          4. the client distinguishes transport, success JSON and error JSON;
          5. error switching uses code rather than message;
          6. every consumed block type has an explicit renderer and fallback;
          7. text is rendered safely in the target framework;
          8. media uses prepared url, width and height;
          9. collection filters are URL-encoded and allowed;
          10. cache key includes endpoint, query and locale;
          11. ETag and body are stored atomically as a pair;
          12. 304 retains the previous body;
          13. retry covers only safe transient failures and is bounded;
          14. CORS is configured only when genuinely needed;
          15. the client tolerates additional compatible-version fields;
          16. contract tests use the current openapi.json;
          17. smoke testing covers PL, EN, collection, media, errors and revalidation.

          The API stays small because it exposes a prepared presentation model rather than filesystem details. A client is resilient when it respects that boundary, treats HTTP as a semantic protocol and explicitly maps dynamic blocks.
      note:
        pl: "Kontrakt sieciowy jest częścią produktu. Wdrażaj zmianę API razem ze specyfikacją, testami i kompatybilnym klientem."
        en: "The network contract is part of the product. Release an API change together with its specification, tests and a compatible client."
