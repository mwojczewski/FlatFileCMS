  - id: 01a06d50-6006-7611-8611-000000000011
    type: article-content
    enabled: true
    data:
      anchor: bledy-api
      content:
        pl: |-
          ## 15. Parsuj błędy przed danymi sukcesu

          Błąd ma stabilny kształt z error.code i error.message. W trybie produkcyjnym wyjątek serwera nie ujawnia ścieżek systemu plików ani stosu wywołań. Pole debug może pojawić się wyłącznie przy włączonym debug i nie może stać się zależnością klienta.

          ~~~json
          {
            "error": {
              "code": "PAGE_NOT_FOUND",
              "message": "Page not found"
            }
          }
          ~~~

          Najpierw sprawdź status, później Content-Type i dopiero potem dekoduj oczekiwany wariant odpowiedzi. Nie próbuj interpretować obiektu error jak strony. message może się zmieniać lub zostać przetłumaczone; switch klienta powinien działać na code.

          Błędy 4xx wynikają zwykle z danych wejściowych i automatyczny retry ich nie naprawi. Dla 500 dopuszczalna jest mała liczba prób z wykładniczym backoffem i jitterem, wyłącznie dla operacji GET/HEAD. Ustal budżet czasu, aby awaria CMS-a nie zablokowała całego frontendu.

          ## 16. Odróżnij błąd transportu od odpowiedzi HTTP

          Timeout, błąd DNS, TLS lub zerwane połączenie nie mają JSON-owego code, ponieważ odpowiedź aplikacji nie dotarła. Loguj te przypadki osobno od statusów 4xx/5xx. Dzięki temu monitoring odróżni problem sieciowy od błędnego path i uszkodzonej treści.

          Jeżeli klient posiada ostatnią poprawną, zrewalidowaną kopię publicznej treści, może użyć jej jako kontrolowanego stale fallbacku. Nie zastępuj nią odpowiedzi 404 bez polityki, bo zasób mógł zostać świadomie wycofany.
        en: |-
          ## 15. Parse errors before success data

          An error has a stable shape with error.code and error.message. In production a server exception exposes neither filesystem paths nor a stack trace. debug may appear only with debug enabled and must never become a client dependency.

          ~~~json
          {
            "error": {
              "code": "PAGE_NOT_FOUND",
              "message": "Page not found"
            }
          }
          ~~~

          Check status first, then Content-Type, and only then decode the expected response variant. Never interpret error as a page. message may change or be translated; client switching should use code.

          A 4xx normally results from input and automatic retry cannot repair it. For 500, allow a small attempt count with exponential backoff and jitter, only for GET/HEAD. Set a time budget so a CMS failure cannot stall the complete frontend.

          ## 16. Distinguish a transport error from an HTTP response

          Timeout, DNS, TLS or connection failure has no JSON code because no application response arrived. Log these separately from 4xx/5xx statuses. Monitoring can then distinguish network failure from an invalid path or broken content.

          If a client holds the last valid, revalidated public representation, it may use it as a controlled stale fallback. Do not substitute it for a 404 without policy because the resource may have been intentionally withdrawn.
      note:
        pl: "Nigdy nie pokazuj użytkownikowi surowego debug ani całego body błędu 500. Zachowaj szczegóły w kontrolowanym logu integracji."
        en: "Never display raw debug or the complete 500 body to a user. Retain details in a controlled integration log."
  - id: 01a06d50-6006-7612-8612-000000000012
    type: article-content
    enabled: true
    data:
      anchor: openapi
      content:
        pl: |-
          ## 17. Traktuj OpenAPI jako wykonywalny kontrakt

          Źródłem specyfikacji jest docs/openapi.yaml w wersji OpenAPI 3.1.0. Endpoint /api/openapi.json parsuje YAML po stronie serwera i zwraca pretty-printed JSON z Content-Type application/vnd.oai.openapi+json;version=3.1;charset=UTF-8.

          OpenApiDocument sprawdza co najmniej obecność openapi, info i paths. ETag specyfikacji jest hashem dokładnego JSON-a, Last-Modified pochodzi z pliku YAML, a zgodny If-None-Match zwraca 304. X-Content-Type-Options: nosniff ogranicza błędną interpretację MIME.

          /api/docs osadza interfejs Scalar wskazujący /api/openapi.json. Strona ma robots noindex, CSP ograniczające źródła, no-referrer i nosniff. Skrypt UI jest pobierany z jsDelivr, więc środowisko z restrykcyjnym egress albo offline nadal może używać samej specyfikacji JSON.

          ## 18. Generuj typy, ale weryfikuj semantykę

          Z OpenAPI można generować DTO, klienta TypeScript, modele Kotlin/Swift lub testy kontraktowe. Wygenerowany kod ogranicza literówki w nazwach i typach, ale nie zastępuje reguł domenowych: kolejności blocks, znaczenia locale, strategii 304 ani bezpiecznego renderowania data.

          Po zmianie endpointu aktualizuj jednocześnie router, kontroler, docs/openapi.yaml, testy i dokumentację opisową. CI powinno parsować specyfikację i porównywać przykładowe odpowiedzi z rzeczywistymi testami integracyjnymi.

          Interaktywny panel dokumentacji jest narzędziem developerskim, nie mechanizmem autoryzacji. Publiczne read-only endpointy nie wymagają tokenu. Jeśli w przyszłości powstanie API zapisu, powinno otrzymać osobny model bezpieczeństwa i nie dziedziczyć tej decyzji automatycznie.
        en: |-
          ## 17. Treat OpenAPI as an executable contract

          The specification source is docs/openapi.yaml using OpenAPI 3.1.0. /api/openapi.json parses YAML server-side and returns pretty-printed JSON with Content-Type application/vnd.oai.openapi+json;version=3.1;charset=UTF-8.

          OpenApiDocument verifies at least openapi, info and paths. The specification ETag hashes exact JSON, Last-Modified comes from the YAML file, and matching If-None-Match returns 304. X-Content-Type-Options: nosniff limits incorrect MIME interpretation.

          /api/docs embeds Scalar pointing at /api/openapi.json. The page has robots noindex, a source-restricting CSP, no-referrer and nosniff. Its UI script comes from jsDelivr, so a restricted-egress or offline environment can still consume the JSON specification directly.

          ## 18. Generate types but verify semantics

          OpenAPI can generate DTOs, a TypeScript client, Kotlin/Swift models or contract tests. Generated code reduces mistakes in names and types but cannot replace domain rules: blocks order, locale meaning, 304 strategy or safe rendering of data.

          When changing an endpoint, update router, controller, docs/openapi.yaml, tests and narrative documentation together. CI should parse the specification and compare examples against real integration responses.

          The interactive documentation is a developer tool, not an authorization mechanism. Public read-only endpoints require no token. A future write API should receive a separate security model rather than inheriting this decision automatically.
      note:
        pl: "OpenAPI opisuje interfejs sieciowy. block.yml pozostaje bardziej szczegółowym kontraktem dynamicznych pól data poszczególnych komponentów."
        en: "OpenAPI describes the network interface. block.yml remains the more detailed contract for each component's dynamic data fields."
  - id: 01a06d50-6006-7613-8613-000000000013
    type: article-content
    enabled: true
    data:
      anchor: klient-api
      content:
        pl: |-
          ## 19. Zbuduj klienta warstwowo

          Rozdziel transport HTTP, dekodowanie kontraktu i logikę domenową. Transport odpowiada za base URL, TLS, timeouty, nagłówki, status oraz retry. Dekoder rozpoznaje success i error oraz waliduje podstawowe typy. Repozytorium domenowe mapuje stronę lub kolekcję na potrzeby aplikacji.

          Klucz cache powinien obejmować pełny endpoint, znormalizowane parametry query i wariant locale. Zachowuj razem body, ETag oraz Last-Modified. Po 200 atomowo zastąp cały wpis, po 304 zaktualizuj metadane bez kasowania body, a po nieodwracalnym 404 zastosuj politykę usunięcia.

          Ogranicz maksymalny rozmiar odpowiedzi po stronie klienta, mimo że serwer waliduje treść. Ustaw connect timeout i total timeout. Przekierowania dopuszczaj tylko zgodnie z polityką hostów, a certyfikaty TLS zawsze weryfikuj.

          ## 20. Obserwuj integrację bez wycieku treści

          Loguj metodę, zanonimizowany URL lub nazwę zasobu, status, czas, liczbę bajtów, informację cache hit/304 oraz kod błędu. Nie zapisuj bez ograniczeń całych bloków, treści formularzy ani potencjalnie wrażliwej konfiguracji.

          Mierz osobno latency originu, czas dekodowania i renderowania klienta. Wysoki TTFB wskazuje serwer lub sieć; szybki JSON i wolny interfejs wskazuje kod headless. Procent 304 pokazuje skuteczność rewalidacji, ale zbyt wysoki ruch warunkowy może nadal obciążać origin.

          ## 21. Wdróż test konsumencki

          Dla każdego używanego typu bloku przechowuj fixture minimalną i pełną. Testuj nieznane pola, nieznany type, brak opcjonalnego pola, Unicode, pustą kolekcję, ostatnią stronę paginacji, 304, wszystkie stabilne kody błędów i przełączenie locale z innymi slugami.

          Test smoke po wdrożeniu powinien pobrać health, config, homepage w obu językach, jedną stronę z mediami, kolekcję oraz openapi.json. Następnie powtarza żądanie strony z If-None-Match i oczekuje pustego 304.
        en: |-
          ## 19. Build the client in layers

          Separate HTTP transport, contract decoding and domain logic. Transport owns base URL, TLS, timeouts, headers, status and retries. The decoder distinguishes success from error and validates basic types. A domain repository maps a page or collection to application needs.

          A cache key should include the complete endpoint, normalized query parameters and locale variant. Store body, ETag and Last-Modified together. On 200 atomically replace the entry, on 304 update metadata without deleting body, and on a terminal 404 apply the eviction policy.

          Limit maximum response size client-side even though the server validates content. Set connect and total timeouts. Permit redirects only according to host policy and always verify TLS certificates.

          ## 20. Observe integration without leaking content

          Log method, anonymized URL or resource name, status, duration, byte count, cache hit/304 and error code. Do not record complete blocks, form content or potentially sensitive configuration without bounds.

          Measure origin latency, decoding and client rendering separately. High TTFB points to server or network; fast JSON with slow UI points to headless code. The 304 ratio shows revalidation effectiveness, although excessive conditional traffic may still load origin.

          ## 21. Add a consumer contract test

          Keep minimal and complete fixtures for every consumed block type. Test unknown fields, unknown type, absent optional fields, Unicode, empty collection, final pagination page, 304, every stable error code and locale switching with different slugs.

          A post-deployment smoke test should fetch health, config, homepage in both languages, one media page, a collection and openapi.json. It then repeats a page request with If-None-Match and expects a bodyless 304.
      note:
        pl: "Najbardziej odporny klient nie kopiuje modelu CMS-a w ciemno - jawnie mapuje tylko pola potrzebne aplikacji i toleruje kompatybilne rozszerzenia."
        en: "The most resilient client does not mirror the CMS model blindly-it explicitly maps needed fields and tolerates compatible extensions."
  - id: 01a06d50-6006-7614-8614-000000000014
