  - id: 01a06d50-6006-7604-8604-000000000004
    type: article-content
    enabled: true
    data:
      anchor: kontrakt-api
      content:
        pl: |-
          ## 1. Zrozum granicę publicznego API

          API v1 jest tylko do odczytu i zwraca JSON kodowany jako UTF-8. Klient nigdy nie czyta content.yml, pagination.yml ani block.yml bezpośrednio. Dzięki temu nie musi implementować parsera YAML, fallbacków tłumaczeń, walidacji kontraktów, routingu ani fingerprintów mediów.

          Prefiks /api/v1 jest częścią kontraktu wersji. Zmiany kompatybilne mogą rozszerzać odpowiedzi, dlatego klient powinien ignorować nieznane pola. Zmiana znaczenia istniejącego pola, jego typu albo usunięcie wymagałaby nowej wersji API.

          API udostępnia wyłącznie zasoby opublikowane. Wyłączona strona jest nierozróżnialna od nieistniejącej i zwraca PAGE_NOT_FOUND. Wyłączone bloki są walidowane podczas wczytywania dokumentu, lecz pomijane w reprezentacji publicznej.

          ## 2. Wybieraj locale jawnie

          Parametr lang jest opcjonalny. Bez niego API używa aktywnego języka domyślnego z config/languages.yml. Wartość musi być stringiem i wskazywać aktywny język; w przeciwnym razie odpowiedź ma status 400 oraz kod LANGUAGE_NOT_AVAILABLE.

          ~~~bash
          curl --fail-with-body +            --header 'Accept: application/json' +            'https://example.com/api/v1/pages?lang=pl'
          ~~~

          W przeciwieństwie do strony SSR ścieżka API nie ma prefiksu /pl ani /en. Język wpływa jednak na segmenty path. Polska strona może być dostępna jako pages/oferta?lang=pl, a angielska jako pages/services?lang=en. Pole url w odpowiedzi zawiera już publiczny URL witryny z prefiksem locale, jeśli instalacja jest wielojęzyczna.

          ## 3. Nie pomyl homepage z listą stron

          GET /api/v1/pages celowo zwraca homepage. Nie jest indeksem wszystkich stron. Ewentualny przyszły endpoint listy otrzyma osobną trasę, aby nie zmieniać istniejącego kontraktu.

          Health endpoint zwraca status, nazwę aplikacji i numer etapu. Potwierdza działanie runtime, ale nie zastępuje testu konkretnej strony, konfiguracji ani połączeń zależnych od treści.
        en: |-
          ## 1. Understand the public API boundary

          API v1 is read-only and returns UTF-8 JSON. A client never reads content.yml, pagination.yml or block.yml directly. It therefore implements neither YAML parsing, translation fallback, contract validation, routing nor media fingerprints.

          The /api/v1 prefix is part of the version contract. Compatible changes may extend responses, so clients should ignore unknown fields. Changing the meaning or type of an existing field, or removing it, would require a new API version.

          The API exposes published resources only. A disabled page is indistinguishable from an absent one and returns PAGE_NOT_FOUND. Disabled blocks are validated while loading the document but omitted from the public representation.

          ## 2. Select locale explicitly

          The lang parameter is optional. Without it, the API uses the active default language from config/languages.yml. The value must be a string identifying an enabled language; otherwise the response has status 400 and code LANGUAGE_NOT_AVAILABLE.

          ~~~bash
          curl --fail-with-body +            --header 'Accept: application/json' +            'https://example.com/api/v1/pages?lang=en'
          ~~~

          Unlike an SSR route, the API path contains no /pl or /en prefix. Language still affects path segments. A Polish page may be pages/oferta?lang=pl and its English equivalent pages/services?lang=en. The response url is already the website's public URL with a locale prefix when the installation is multilingual.

          ## 3. Do not confuse the homepage with a page list

          GET /api/v1/pages deliberately returns the homepage. It is not an index of every page. Any future list endpoint gets a separate route to preserve this contract.

          The health endpoint returns status, application name and stage number. It confirms runtime operation but does not replace a probe of a specific page, configuration or content-dependent connection.
      note:
        pl: "Tożsamość katalogowa strony nie jest parametrem API. path zawsze oznacza lokalizowaną ścieżkę publiczną bez prefiksu języka."
        en: "A page's directory identity is not an API parameter. path always means the localized public path without a language prefix."
  - id: 01a06d50-6006-7605-8605-000000000005
    type: code-showcase
    enabled: true
    data:
      eyebrow:
        pl: "Pierwsze żądanie"
        en: "First request"
      title:
        pl: "Pobierz stronę i sprawdź odpowiedź przed użyciem danych."
        en: "Fetch a page and verify the response before using data."
      description:
        pl: "Minimalny klient sprawdza status, Content-Type oraz podstawowy kształt JSON. Timeout przerywa integrację, która nie może czekać bez końca."
        en: "A minimal client checks status, Content-Type and the basic JSON shape. A timeout stops an integration that cannot wait forever."
      filename: client.php
      code: |-
        <?php
        declare(strict_types=1);

        $context = stream_context_create([
            'http' => [
                'method' => 'GET',
                'header' => "Accept: application/json\r\n",
                'timeout' => 5,
                'ignore_errors' => true,
            ],
        ]);

        $body = file_get_contents(
            'https://example.com/api/v1/pages/services?lang=en',
            false,
            $context,
        );

        if ($body === false) {
            throw new RuntimeException('API transport failed.');
        }

        $page = json_decode($body, true, flags: JSON_THROW_ON_ERROR);
        if (!is_array($page) || !is_string($page['title'] ?? null)) {
            throw new RuntimeException('Unexpected API response.');
        }
      bullets:
        - text:
            pl: "W produkcji odczytaj status z klienta HTTP i rozróżnij transport od błędu API."
            en: "In production read status from the HTTP client and distinguish transport from an API error."
        - text:
            pl: "Nie wyłączaj walidacji TLS i ustaw krótki timeout połączenia oraz odpowiedzi."
            en: "Never disable TLS validation; set short connection and response timeouts."
        - text:
            pl: "Waliduj pola używane przez aplikację, nawet gdy OpenAPI generuje typy."
            en: "Validate fields used by the application even when OpenAPI generates types."
  - id: 01a06d50-6006-7606-8606-000000000006
    type: article-content
    enabled: true
    data:
      anchor: strony-api
      content:
        pl: |-
          ## 4. Czytaj stronę jako znormalizowany model widoku

          Odpowiedź strony zawiera id, locale, url, layout, title, seo i blocks. Jest to ta sama warstwa prezentacyjna, na której opiera się SSR, ale bez HTML-a. API nie wywołuje strony SSR, a SSR nie odpytuje API przez HTTP - oba adaptery korzystają ze wspólnej PageViewModelFactory.

          ~~~json
          {
            "id": "services",
            "locale": "en",
            "url": "/en/services",
            "layout": "default",
            "title": "Services",
            "seo": {
              "title": "Services - Example",
              "description": "Technical services",
              "canonical": "https://example.com/en/services",
              "robots": { "index": true, "follow": true },
              "openGraph": {},
              "twitter": {},
              "jsonLd": {}
            },
            "blocks": []
          }
          ~~~

          id jest stabilną tożsamością wewnętrzną. url to wyliczona trasa publiczna, layout jest wskazówką prezentacyjną, a title i seo są już zlokalizowane oraz mają zastosowane fallbacki globalne. Klient nie powinien samodzielnie dopisywać suffixu SEO ani konstruować canonicala.

          ## 5. Traktuj blocks jako uporządkowaną sumę typów

          Każdy blok zawiera co najmniej UUID id, string type i mapę data. Kolejność tablicy jest kolejnością redakcyjną. data zależy od definicji danego typu, dlatego klient headless potrzebuje dispatchera po type oraz bezpiecznego fallbacku dla nieznanego komponentu.

          ~~~javascript
          const renderers = {
            hero: renderHero,
            gallery: renderGallery,
            'article-content': renderArticle
          };

          for (const block of page.blocks) {
            const render = renderers[block.type];
            if (render) render(block.data, block.id);
          }
          ~~~

          Nieznany type nie powinien przewracać całej aplikacji. Zaloguj niezgodność kontraktu i pomiń komponent albo pokaż kontrolowany placeholder w środowisku developerskim. Nie renderuj nazw pól jako HTML automatycznie.

          ## 6. Używaj gotowych metadanych mediów

          Pola image i file zachowują lokalny src, ale otrzymują także niezmienny url, mimeType, size oraz fingerprint. Obraz dodatkowo zawiera width i height. Klient używa url bez wyprowadzania ścieżki systemu plików lub własnego hasha.

          URL mediów jest fingerprintowany. Można go długo cache'ować jako immutable, ponieważ zmiana bajtów prowadzi do nowego adresu. width i height pozwalają zarezerwować miejsce w layoucie i ograniczyć CLS przed pobraniem pliku.
        en: |-
          ## 4. Read a page as a normalized view model

          A page response contains id, locale, url, layout, title, seo and blocks. This is the same presentation layer used by SSR, but without HTML. API never invokes the SSR page and SSR never requests API over HTTP-both adapters use the shared PageViewModelFactory.

          ~~~json
          {
            "id": "services",
            "locale": "en",
            "url": "/en/services",
            "layout": "default",
            "title": "Services",
            "seo": {
              "title": "Services - Example",
              "description": "Technical services",
              "canonical": "https://example.com/en/services",
              "robots": { "index": true, "follow": true },
              "openGraph": {},
              "twitter": {},
              "jsonLd": {}
            },
            "blocks": []
          }
          ~~~

          id is a stable internal identity. url is the derived public route, layout is a presentation hint, while title and seo are already localized with global fallbacks applied. A client should neither append the SEO suffix nor construct canonical itself.

          ## 5. Treat blocks as an ordered tagged union

          Every block contains at least UUID id, string type and a data map. Array order is editorial order. data depends on the type definition, so a headless client needs a dispatcher by type and a safe fallback for an unknown component.

          ~~~javascript
          const renderers = {
            hero: renderHero,
            gallery: renderGallery,
            'article-content': renderArticle
          };

          for (const block of page.blocks) {
            const render = renderers[block.type];
            if (render) render(block.data, block.id);
          }
          ~~~

          An unknown type should not crash the complete application. Log the contract mismatch and skip the component, or show a controlled development placeholder. Never render field names automatically as HTML.

          ## 6. Use prepared media metadata

          image and file fields retain local src but also receive immutable url, mimeType, size and fingerprint. An image additionally contains width and height. The client uses url without deriving a filesystem path or custom hash.

          Media URLs are fingerprinted. They can be cached as immutable because changing bytes creates a new address. width and height let the layout reserve space and reduce CLS before downloading the file.
      note:
        pl: "Blocks jest kontraktem danych, nie zdalnym HTML-em. O bezpieczeństwo renderowania w przeglądarce nadal odpowiada klient."
        en: "Blocks is a data contract, not remote HTML. The client remains responsible for safe browser rendering."
  - id: 01a06d50-6006-7607-8607-000000000007
    type: article-content
    enabled: true
    data:
      anchor: kolekcje-api
      content:
        pl: |-
          ## 7. Pobieraj kolekcję przez jej publiczną ścieżkę

          Endpoint collections/{path} rozpoznaje lokalizowaną publiczną trasę kolekcji. Odpowiedź ma cztery sekcje: collection, items, pagination oraz filters.

          collection zawiera id, locale, url, layout, title i seo. Każdy item zawiera id, wyliczony url, zlokalizowany title oraz attributes. Atrybuty pochodzą z dodatkowych pól strony, na przykład date, category, excerpt lub order. Pełne blocks wpisu pobierasz dopiero przez endpoint strony wskazany przez url po usunięciu prefiksu locale i przekazaniu właściwego lang.

          ## 8. Traktuj filtr jako część kontraktu kolekcji

          Parametr page musi być dodatnią liczbą całkowitą i numeracja zaczyna się od 1. Tylko filtry zadeklarowane w pagination.yml wpływają na zapytanie. Jeżeli filtr ma allowedValues, wartość spoza listy daje status 400 z INVALID_COLLECTION_QUERY, zamiast cichego pustego wyniku.

          ~~~bash
          curl --get 'https://example.com/api/v1/collections/blog' +            --data-urlencode 'lang=pl' +            --data-urlencode 'page=2' +            --data-urlencode 'category=tutorial'
          ~~~

          Odpowiedź pagination podaje page, perPage, totalItems i totalPages. totalPages może być 0 dla pustego zbioru. Nie wyliczaj go ponownie po stronie klienta. filters zawiera faktycznie zastosowane wartości i jest lepszym źródłem stanu interfejsu niż surowy query string.

          ## 9. Rozróżniaj listę od dokumentu

          Element kolekcji jest lekką projekcją do kart i indeksów. Nie zawiera całego modelu strony. To chroni rozmiar odpowiedzi przed mnożeniem ciężkich bloków oraz danych galerii przez perPage.

          Typowy klient pobiera kolekcję dla widoku listy, a następnie pojedynczą stronę po wejściu użytkownika. Prefetch wykonuj selektywnie, z limitem współbieżności i z wykorzystaniem ETag.
        en: |-
          ## 7. Fetch a collection by its public path

          collections/{path} resolves a collection's localized public route. The response has four sections: collection, items, pagination and filters.

          collection contains id, locale, url, layout, title and seo. Each item contains id, derived url, localized title and attributes. Attributes come from extra page fields such as date, category, excerpt or order. Fetch an entry's complete blocks through its page endpoint, using the path without locale prefix and passing the correct lang.

          ## 8. Treat filters as part of the collection contract

          page must be a positive integer and numbering starts at 1. Only filters declared in pagination.yml affect the query. When a filter has allowedValues, a value outside the list yields 400 INVALID_COLLECTION_QUERY rather than a silently empty result.

          ~~~bash
          curl --get 'https://example.com/api/v1/collections/blog' +            --data-urlencode 'lang=en' +            --data-urlencode 'page=2' +            --data-urlencode 'category=tutorial'
          ~~~

          pagination supplies page, perPage, totalItems and totalPages. totalPages may be 0 for an empty result. Never recalculate it client-side. filters contains the values actually applied and is a better UI-state source than the raw query string.

          ## 9. Distinguish a list item from a document

          A collection item is a lightweight card and index projection. It does not contain the page's complete model. This prevents heavy blocks and galleries from multiplying response size by perPage.

          A typical client fetches the collection for a list view and the individual page after navigation. Prefetch selectively, with a concurrency limit and ETag revalidation.
      note:
        pl: "Nie zakładaj, że każdy parametr query jest filtrem. Serwer celowo stosuje wyłącznie filtry zadeklarowane przez właściciela kolekcji."
        en: "Do not assume every query parameter is a filter. The server deliberately applies only filters declared by the collection owner."
  - id: 01a06d50-6006-7608-8608-000000000008
    type: article-content
    enabled: true
    data:
      anchor: projekcje-api
      content:
        pl: |-
          ## 10. Pobieraj menu z rozstrzygniętymi linkami

          /api/v1/navigation zwraca locale oraz menus. Każde menu jest tablicą zlokalizowanych pozycji, których linki do stron zostały rozwiązane przez PageRouteIndex. Klient nie musi znać tożsamości katalogowej ani slugów przodków.

          Pozycje mogą mieć children i dodatkowe atrybuty kontraktu, na przykład target. Zachowuj kolejność tablic. Gdy budujesz menu dostępne klawiaturą, stan rozwinięcia i ARIA należą do klienta, nie do API.

          ## 11. Używaj tylko publicznej projekcji konfiguracji

          /api/v1/config zwraca locale, defaultLocale, multilingual, languages oraz config. ConfigurationRepository najpierw buduje jawną publicProjection, a dopiero potem lokalizuje ją dla żądanego języka.

          Endpoint nigdy nie zwraca surowego setup.yml. Sekrety, dane SMTP, klucze usług i ścieżki wewnętrzne nie powinny znaleźć się w odpowiedzi nawet wtedy, gdy istnieją w konfiguracji serwera. Publiczna projekcja jest allowlistą, nie filtrem usuwającym kilka znanych sekretów.

          Metadane languages pozwalają zbudować przełącznik języka globalnego. Dla przełączania bieżącej strony używaj jednak adresów wynikających z routingu treści; sam kod locale nie wystarcza, gdy slugi różnią się między językami.

          ## 12. Nie zakładaj CORS bez sprawdzenia wdrożenia

          Kod aplikacji nie emituje automatycznie Access-Control-Allow-Origin dla publicznego API. Klient działający na tej samej domenie nie potrzebuje CORS. Aplikacja na innej domenie wymaga jawnej, możliwie wąskiej konfiguracji originów na serwerze WWW lub warstwie proxy.

          Nie używaj wildcarda z credentials i nie dodawaj nagłówków autoryzacji do read-only API, które ich nie wymaga. Jeżeli frontend może działać same-origin, jest to prostszy i bezpieczniejszy wariant.
        en: |-
          ## 10. Fetch menus with resolved links

          /api/v1/navigation returns locale and menus. Every menu is an array of localized items whose page links have already been resolved through PageRouteIndex. A client need not know directory identities or ancestor slugs.

          Items may have children and extra contract attributes such as target. Preserve array order. When building a keyboard-accessible menu, expansion state and ARIA belong to the client, not the API.

          ## 11. Use only the public configuration projection

          /api/v1/config returns locale, defaultLocale, multilingual, languages and config. ConfigurationRepository first builds an explicit publicProjection and only then localizes it for the requested language.

          The endpoint never returns raw setup.yml. Secrets, SMTP details, service keys and internal paths must not appear even when they exist in server configuration. A public projection is an allowlist, not a filter removing a few known secrets.

          languages metadata can build a global language selector. For switching the current page, however, use addresses derived from content routing; a locale code alone is insufficient when slugs differ between languages.

          ## 12. Never assume CORS without checking deployment

          Application code does not automatically emit Access-Control-Allow-Origin for the public API. A same-domain client needs no CORS. An application on another domain requires an explicit, narrow origin configuration at the web server or proxy layer.

          Never combine a wildcard with credentials and do not add authorization headers to a read-only API that does not require them. A same-origin frontend is simpler and safer whenever possible.
      note:
        pl: "Publiczne API oznacza publiczny odczyt treści, nie publiczny dostęp do całej konfiguracji instalacji."
        en: "Public API means public content reads, not public access to the installation's complete configuration."
  - id: 01a06d50-6006-7609-8609-000000000009
    type: article-content
    enabled: true
    data:
      anchor: cache-api
      content:
        pl: |-
          ## 13. Rewaliduj zamiast pobierać bezwarunkowo

          Udane odpowiedzi treści zawierają ETag, Last-Modified oraz Cache-Control: public, max-age=0, must-revalidate. ETag jest SHA-256 dokładnej reprezentacji JSON zamkniętym w cudzysłowie. Last-Modified to najnowszy czas źródła wpływającego na wynik.

          Przy następnym żądaniu wyślij If-None-Match z zachowanym ETag. Serwer akceptuje tag silny, jego wariant W/ oraz wildcard. Gdy tag pasuje, zwraca 304 z pustym body. Gdy If-None-Match jest obecny, ma pierwszeństwo; niepasujący tag prowadzi do 200 bez oceniania If-Modified-Since.

          ~~~bash
          curl --include +            --header 'If-None-Match: "0123456789abcdef..."' +            'https://example.com/api/v1/pages?lang=pl'
          ~~~

          Bez ETag klient może wysłać If-Modified-Since w formacie daty HTTP. Poprawna data nie wcześniejsza niż modifiedAt daje 304. Nie używaj lokalnego czasu urządzenia jako wartości - zachowaj nagłówek otrzymany z serwera.

          ## 14. Wykorzystuj HEAD do taniego odczytu metadanych

          Router rejestruje każdą trasę GET również dla HEAD. Uruchamia ten sam handler, a następnie zwraca identyczny status i nagłówki z pustym body. HEAD potwierdza istnienie zasobu lub pobiera walidatory, lecz po stronie serwera nadal może wymagać zbudowania reprezentacji.

          Nie zakładaj więc, że HEAD jest darmowy obliczeniowo. Jego główną korzyścią jest brak transferu body. Do zwykłej rewalidacji często lepszy jest warunkowy GET, który zwróci 304 albo od razu nowe dane.

          ETag strony zmienia się wraz z bajtami JSON. Last-Modified uwzględnia stronę, definicje użytych bloków, media, indeks tras, języki i konfigurację. Dla kolekcji dochodzi wynik zapytania oraz zasoby wpływające na listę.
        en: |-
          ## 13. Revalidate instead of fetching unconditionally

          Successful content responses contain ETag, Last-Modified and Cache-Control: public, max-age=0, must-revalidate. ETag is SHA-256 of the exact JSON representation enclosed in quotes. Last-Modified is the newest source time affecting the result.

          On the next request, send If-None-Match with the stored ETag. The server accepts a strong tag, its W/ variant and wildcard. A match returns 304 with an empty body. When If-None-Match is present it takes precedence; a mismatch yields 200 without evaluating If-Modified-Since.

          ~~~bash
          curl --include +            --header 'If-None-Match: "0123456789abcdef..."' +            'https://example.com/api/v1/pages?lang=en'
          ~~~

          Without ETag, a client may send If-Modified-Since as an HTTP date. A valid date not earlier than modifiedAt yields 304. Never use the device's local time-retain the header received from the server.

          ## 14. Use HEAD for inexpensive metadata transfer

          The router registers every GET route for HEAD as well. It executes the same handler, then returns identical status and headers with an empty body. HEAD confirms resource existence or obtains validators, although the server may still have to construct the representation.

          HEAD is therefore not necessarily computationally free. Its main benefit is no body transfer. A conditional GET is often better for normal revalidation because it yields either 304 or the new data immediately.

          A page ETag changes with JSON bytes. Last-Modified tracks the page, used block definitions, media, route index, languages and configuration. A collection additionally tracks query results and resources affecting the list.
      note:
        pl: "Po 304 zachowaj poprzednie body. Pusta odpowiedź nie oznacza pustego zasobu, lecz potwierdzenie aktualności lokalnej kopii."
        en: "After 304 retain the previous body. An empty response does not mean an empty resource; it validates the local copy."
