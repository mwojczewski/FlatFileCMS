  - id: 01a06d50-7007-7704-8704-000000000004
    type: article-content
    enabled: true
    data:
      anchor: model-zagrozen
      content:
        pl: |-
          ## 1. Najpierw nazwij aktywa

          FlatFile CMS chroni trzy różne klasy danych. Treść, konfiguracja publiczna, definicje bloków i szablony są plikami. Tożsamości administratorów, skróty haseł, WebAuthn i tokeny odzyskiwania są w SQLite. Sekrety wdrożenia — APP_SECRET, SMTP i prywatne tokeny usług — należą wyłącznie do środowiska albo zewnętrznego secret managera.

          Rozdzielenie własności jest kontrolą bezpieczeństwa. Skopiowanie pages i config nie powinno przenieść haseł. Publiczny endpoint config nie może czytać surowego setup.yml. Repozytorium Git nie powinno zawierać .env.local ani produkcyjnej bazy.

          ## 2. Ustal aktorów i ich uprawnienia

          Użytkownik publiczny może czytać opublikowane HTML, JSON i media. Administrator może zarządzać treścią i zwykłymi kontami ROLE_ADMIN. Superadmin jest kontem technicznym tworzonym tylko przez CLI; admin nie może go zobaczyć, wyliczyć po ID, zmienić ani usunąć.

          Proces PHP ma dostęp zapisu tylko do katalogów runtime oraz obszarów treści wymagających edycji. Kod aplikacji, vendor, bloki i templates powinny być dla niego read-only. Operator systemu ma szersze uprawnienia i pozostaje poza granicą gwarancji aplikacji.

          ## 3. Zapisz jawne założenie systemowe

          SafePathResolver chroni przed ścieżką kontrolowaną przez request i przed ucieczką symlinkiem. Nie chroni przed napastnikiem mającym arbitralny zapis lokalny jako ten sam użytkownik systemowy, który może ścigać się z operacją PHP. Taki model wymaga izolacji systemowej, oddzielnych kont, poprawnych właścicieli, ograniczeń hostingu i bezpiecznego procesu wdrożenia.

          Obrona warstwowa oznacza, że przejęcie jednego mechanizmu nie powinno automatycznie dawać wszystkiego. Kradzież cookie ogranicza timeout sesji i drugi składnik przy logowaniu; błąd w formularzu ogranicza walidacja domenowa i system plików; wyciek publicznego YAML-a nie może ujawnić sekretów, bo sekrety nie należą do YAML-a.
        en: |-
          ## 1. Name the assets first

          FlatFile CMS protects three distinct data classes. Content, public configuration, block definitions and templates are files. Administrator identities, password hashes, WebAuthn and recovery tokens live in SQLite. Deployment secrets—APP_SECRET, SMTP and private service tokens—belong exclusively to the environment or an external secret manager.

          Ownership separation is a security control. Copying pages and config should not transfer passwords. The public config endpoint must not read raw setup.yml. Git should contain neither .env.local nor the production database.

          ## 2. Identify actors and privileges

          A public visitor may read published HTML, JSON and media. An administrator may manage content and regular ROLE_ADMIN accounts. A superadmin is a technical account created only through CLI; an admin cannot view it, infer it by ID, modify it or delete it.

          The PHP process gets write access only to runtime directories and editable content areas. Application code, vendor, blocks and templates should be read-only to it. A system operator has broader rights and lies outside application guarantees.

          ## 3. State the operating-system assumption

          SafePathResolver protects against a request-controlled path and symlink escape. It does not protect against an attacker with arbitrary local writes as the same operating-system user who can race PHP operations. That threat requires OS isolation, separate accounts, correct ownership, hosting restrictions and a safe deployment process.

          Defense in depth means compromising one mechanism should not automatically grant everything. A stolen cookie is limited by session timeouts and a second factor at login; a form defect is constrained by domain and filesystem validation; exposed public YAML cannot leak secrets because secrets do not belong in YAML.
      note:
        pl: Bez modelu zagrożeń łatwo nazwać bezpieczeństwem dowolny pojedynczy nagłówek. Najpierw określ aktywo, aktora, granicę i skutek naruszenia.
        en: Without a threat model any single header can be called security. First identify the asset, actor, boundary and breach impact.
  - id: 01a06d50-7007-7705-8705-000000000005
    type: article-content
    enabled: true
    data:
      anchor: bootstrap
      content:
        pl: |-
          ## 4. Nie pozwól uruchomić słabej produkcji

          ProductionGuard odrzuca środowisko produkcyjne z włączonym debug, krótkim lub przykładowym APP_SECRET oraz niebezpiecznym cookie administratora. Minimalny kontrakt obejmuje APP_ENV=production, APP_DEBUG=0, co najmniej 32 losowe bajty sekretu i SESSION_COOKIE_SECURE=1.

          APP_SECRET zasila mechanizmy wymagające tajnego klucza, dlatego nie może być stałą skopiowaną z dokumentacji. Generuj go poza historią shella i przekazuj przez kontrolowany system sekretów. Rotacja może unieważnić dane zależne od klucza i musi być zaplanowanym zdarzeniem.

          ~~~dotenv
          APP_ENV=production
          APP_DEBUG=0
          APP_SECRET=<co-najmniej-32-losowe-bajty>
          SESSION_COOKIE_SECURE=1
          SESSION_COOKIE_SAME_SITE=Lax
          WEBAUTHN_RP_ID=example.com
          ~~~

          ## 5. Ufaj X-Forwarded-For tylko od znanego proxy

          Request boundary korzysta z forwarded address wyłącznie, gdy bezpośredni peer należy do TRUSTED_PROXIES. Wartość przyjmuje dokładne IP i sieci CIDR. Łańcuch jest oceniany od najbliższego proxy do pierwszego niezaufanego adresu klienta.

          Ustawienie 0.0.0.0/0 lub ::/0 pozwoliłoby dowolnemu klientowi podszyć się pod adres używany przez rate limiting i audyt. Dla Cloudflare utrzymuj aktualne oficjalne zakresy oraz zablokuj bezpośredni dostęp do originu albo upewnij się, że ruch bez proxy jest traktowany jako bezpośredni.

          ## 6. Ogranicz request przed aplikacją i w aplikacji

          Serwer WWW powinien ograniczać rozmiar body, timeouty i dozwolone entrypointy. Router dopuszcza metody przypisane trasie i zwraca METHOD_NOT_ALLOWED dla innej metody. Application odrzuca bodyTooLarge kodem REQUEST_BODY_TOO_LARGE przed uruchomieniem logiki kontrolera.

          Limity PHP upload_max_filesize i post_max_size muszą obsłużyć dozwolony upload, ale serwer nadal powinien mieć skończony limit requestu. Większy limit transportu nie zmienia media.maxUploadBytes — plik musi przejść oba poziomy.
        en: |-
          ## 4. Refuse to start weak production

          ProductionGuard rejects production with debug enabled, a short or example APP_SECRET, or an insecure administrator cookie. The minimal contract includes APP_ENV=production, APP_DEBUG=0, at least 32 random secret bytes and SESSION_COOKIE_SECURE=1.

          APP_SECRET feeds mechanisms requiring a secret key, so it cannot be a constant copied from documentation. Generate it outside shell history and provide it through controlled secret management. Rotation may invalidate key-dependent data and must be a planned event.

          ~~~dotenv
          APP_ENV=production
          APP_DEBUG=0
          APP_SECRET=<at-least-32-random-bytes>
          SESSION_COOKIE_SECURE=1
          SESSION_COOKIE_SAME_SITE=Lax
          WEBAUTHN_RP_ID=example.com
          ~~~

          ## 5. Trust X-Forwarded-For only from a known proxy

          The request boundary uses a forwarded address only when the direct peer belongs to TRUSTED_PROXIES. The setting accepts exact IPs and CIDR ranges. A chain is evaluated from the nearest proxy toward the first untrusted client address.

          Setting 0.0.0.0/0 or ::/0 would let any client spoof the address used by rate limiting and audit. With Cloudflare, maintain current official ranges and block direct origin access, or ensure traffic bypassing the proxy is treated as direct.

          ## 6. Bound the request before and inside the application

          The web server should limit body size, timeouts and executable entrypoints. Router permits methods assigned to a route and returns METHOD_NOT_ALLOWED for another method. Application rejects bodyTooLarge with REQUEST_BODY_TOO_LARGE before controller logic.

          PHP upload_max_filesize and post_max_size must accommodate allowed uploads, but the server still needs a finite request limit. A larger transport limit does not change media.maxUploadBytes—the file must pass both levels.
      note:
        pl: release:check weryfikuje guardy środowiska, ale nie potwierdzi zewnętrznej reguły firewalla ani aktualności zakresów Cloudflare.
        en: release:check verifies environment guards but cannot prove an external firewall rule or current Cloudflare ranges.
