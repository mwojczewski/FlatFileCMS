    id: 01a09b30-8008-7804-8804-000000000004
    type: article-content
    enabled: true
    data:
      anchor: model-release
      content:
        pl: |-
          ## 1. Zacznij od modelu release, nie od kopiowania katalogu

          Produkcyjne wdrożenie powinno wskazywać dokładnie jeden artefakt kodu i jeden zgodny stan danych. Nie edytuj plików PHP na działającym serwerze i nie uruchamiaj `composer update` na hoście. Lockfile ma zamienić zestaw zależności w powtarzalny wynik, a identyfikator release pozwala połączyć odpowiedź aplikacji, logi i cache z konkretną wersją.

          Trzymaj kolejne wydania w osobnych katalogach, na przykład `releases/<id>`, a aktywną wersję wybieraj pojedynczym wskaźnikiem `current`. Katalog współdzielony powinien zawierać tylko stan, który ma przeżyć zmianę kodu: treść, konfigurację, bazę, logi, sesje i sekrety. Zanim zastosujesz taki układ, sprawdź ograniczenie aplikacji: korzenie kontrolowane przez `release:check` nie mogą być symlinkami. Bezpieczniejszy prosty wariant to przygotowanie kompletnego katalogu release i atomowa zmiana document root albo konfiguracji upstreamu.

          Rozdziel build od aktywacji. Build może uruchamiać pełne `composer check` bez produkcyjnych sekretów. Aktywacja działa na docelowym hoście, gdzie dostępne są finalne uprawnienia, rozszerzenia PHP, baza i `.env.local`; tam obowiązkowy jest `php bin/cms release:check`.
        en: |-
          ## 1. Start with a release model, not directory copying

          A production deployment should identify exactly one code artifact and one compatible data state. Do not edit PHP files on a live server and do not run `composer update` on the host. The lockfile turns the dependency set into a repeatable result, while the release identifier connects application responses, logs and cache to one version.

          Keep releases in separate directories such as `releases/<id>` and select the active version through one `current` pointer. Shared storage should contain only state that survives code changes: content, configuration, database, logs, sessions and secrets. Check one application constraint before adopting this layout: roots inspected by `release:check` must not be symlinks. A safer simple variant is a complete release directory with an atomic document-root or upstream switch.

          Separate build from activation. Build can run the complete `composer check` without production secrets. Activation runs on the target host where final permissions, PHP extensions, the database and `.env.local` exist; this is where `php bin/cms release:check` is mandatory.
      note:
        pl: 'Zielony pipeline nie dowodzi, że host ma poprawne uprawnienia, domenę lub socket PHP-FPM. Te własności sprawdza etap przed przełączeniem ruchu.'
        en: 'A green pipeline does not prove that the host has correct permissions, domain or PHP-FPM socket. The pre-traffic stage verifies those properties.'
  -
    id: 01a09b30-8008-7805-8805-000000000005
    type: code-showcase
