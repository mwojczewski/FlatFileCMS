    data:
      eyebrow:
        pl: 'Powtarzalny build'
        en: 'Repeatable build'
      title:
        pl: 'Buduj dokładnie z composer.lock.'
        en: 'Build exactly from composer.lock.'
      description:
        pl: 'Zależności produkcyjne powstają podczas budowania artefaktu. Kontrole jakości wykonaj przed usunięciem zależności developerskich albo w oddzielnym etapie pipeline.'
        en: 'Production dependencies are created while building the artifact. Run quality checks before removing development dependencies or in a separate pipeline stage.'
      filename: release-build.sh
      code: |-
        composer install --no-interaction --prefer-dist
        composer check
        composer install --no-dev --classmap-authoritative \
          --no-interaction --prefer-dist

        test -f composer.lock
        test -f public/index.php
        test -f deploy/nginx.conf.example
      bullets:
        -
          text:
            pl: 'Nie zmienia wersji zależności podczas wdrożenia.'
            en: 'Does not change dependency versions during deployment.'
        -
          text:
            pl: 'Artefakt nie zawiera PHPUnit ani narzędzi analizy.'
            en: 'The artifact excludes PHPUnit and analysis tools.'
        -
          text:
            pl: 'Autoloader classmap jest zoptymalizowany dla produkcji.'
            en: 'The classmap autoloader is optimized for production.'
        -
