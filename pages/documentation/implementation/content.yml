    id: 01a09b30-8008-7811-8811-000000000011
    type: article-content
    enabled: true
    data:
      anchor: przelaczenie
      content:
        pl: |-
          ## 6. Przełącz ruch atomowo i obserwuj nową wersję

          Nie kopiuj plików bezpośrednio do aktywnego katalogu, bo część requestów zobaczy mieszaninę starego i nowego kodu. Przygotuj release obok, zakończ instalację zależności i preflight, a następnie wykonaj pojedynczą zmianę document root, upstreamu albo obrazu kontenera. Stary artefakt pozostaw dostępny do czasu zamknięcia okna obserwacji.

          Zmiana `APP_RELEASE` tworzy nowy namespace publicznego cache HTML. Nie wymaga synchronicznego usuwania poprzednich wpisów. `php bin/cms cache:prune --dry-run` pokaże dane do usunięcia, a właściwe `cache:prune` może działać jako bezpieczne zadanie utrzymaniowe. `cache:clear` usuwa odtwarzalne wpisy, ale nie powinno być automatycznym lekarstwem na każdy problem.

          Pierwsze requesty mogą utworzyć fingerprintowane zasoby bloków i cache, dlatego po aktywacji odwiedź krytyczne strony w obu językach. Obserwuj kody 5xx, czas odpowiedzi, logi PHP-FPM i `storage/logs/application-YYYY-MM-DD.log`. `LOG_LEVEL=notice` obejmuje także brakujące publiczne trasy; `LOG_MAX_FILES` ogranicza retencję, ale nie zastępuje polityki eksportu logów.
        en: |-
          ## 6. Switch traffic atomically and observe the new version

          Do not copy files directly into the active directory because some requests will see a mix of old and new code. Prepare the release alongside it, finish dependency installation and preflight, then perform one document-root, upstream or container-image switch. Keep the previous artifact available until the observation window closes.

          Changing `APP_RELEASE` creates a new public HTML-cache namespace. It does not require synchronous deletion of previous entries. `php bin/cms cache:prune --dry-run` reports removable data and the actual `cache:prune` can run as safe maintenance. `cache:clear` removes reproducible entries but should not become the automatic remedy for every issue.

          Initial requests may create fingerprinted block assets and cache, so visit critical pages in both languages after activation. Watch 5xx codes, response time, PHP-FPM logs and `storage/logs/application-YYYY-MM-DD.log`. `LOG_LEVEL=notice` also covers missing public routes; `LOG_MAX_FILES` limits retention but does not replace a log-export policy.
      note:
        pl: 'Release jest aktywny dopiero wtedy, gdy publiczny monitoring potwierdza nową wersję — nie wtedy, gdy zakończyło się kopiowanie plików.'
        en: 'A release is active only when public monitoring confirms the new version—not when file copying finishes.'
      bookmarkDescription:
        pl: 'Przełączenie ruchu'
        en: 'Traffic switch'
  -
    id: 01a09b30-8008-7812-8812-000000000012
    type: article-content
    enabled: true
    data:
      anchor: smoke-testy
      content:
        pl: |-
          ## 7. Sprawdź ścieżki odczytu i zapisu

          Smoke test zaczynaj od publicznego originu. Pobierz `/api/v1/health`, stronę HTML w każdym języku, odpowiadającą stronę API, kolekcję, media oraz `openapi.json`. Powtórz żądanie strony z `If-None-Match` i oczekuj pustego `304`. Zweryfikuj poprawny certyfikat, przekierowanie HTTP do HTTPS, nagłówki bezpieczeństwa i brak dostępu do plików spoza `public/`.

          Następnie zaloguj się do panelu i wykonaj kontrolowaną operację zapisu: otwórz builder istniejącej strony, zmień testowy blok, zapisz i sprawdź publiczny wynik. Przetestuj upload małego poprawnego obrazu, wysłanie wiadomości kontaktowej lub odzyskiwanie hasła, jeśli SMTP jest częścią wdrożenia. Po teście przywróć treść przez normalny mechanizm edytora — nie ręczną podmianę pliku.

          Kontrola negatywna jest równie ważna: nieistniejąca strona ma zwrócić bezpieczne 404, próba wejścia do panelu bez sesji ma prowadzić do logowania, a stare dane formularza powinny dać konflikt rewizji zamiast nadpisać nowszą treść. Zajrzyj do audit trail i potwierdź, że zapis administratora został odnotowany.

          Automatyzuj stabilne części scenariusza, ale zachowaj krótki test ręczny funkcji wymagających przeglądarki, cookie, WebAuthn lub odbioru poczty. Wynik smoke testu zapisz razem z identyfikatorem release i czasem aktywacji.
        en: |-
          ## 7. Verify read and write paths

          Start smoke testing at the public origin. Fetch `/api/v1/health`, an HTML page in every language, the corresponding API page, a collection, media and `openapi.json`. Repeat a page request with `If-None-Match` and expect an empty `304`. Verify the certificate, HTTP-to-HTTPS redirect, security headers and absence of access to files outside `public/`.

          Next log into the admin panel and perform a controlled write: open the builder for an existing page, change a test block, save it and inspect the public result. Test upload of a small valid image and contact or password-recovery mail when SMTP is part of the deployment. Restore test content through the normal editor mechanism, not a manual file replacement.

          Negative checks matter as well: a missing page should produce a safe 404, unauthenticated admin access should lead to login, and stale form data should produce a revision conflict instead of overwriting newer content. Inspect the audit trail and confirm that the administrator write was recorded.

          Automate stable parts of the scenario, but retain a short manual test for features requiring a browser, cookies, WebAuthn or mail receipt. Store the smoke-test result with the release identifier and activation time.
      note:
        pl: 'Health endpoint sprawdza dostępność aplikacji, lecz sam nie sprawdza logowania, zapisu YAML, uploadu ani dostarczenia poczty.'
        en: 'The health endpoint checks application availability, but by itself does not verify login, YAML writes, uploads or mail delivery.'
  -
