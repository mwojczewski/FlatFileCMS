    id: 01a09b30-8008-7806-8806-000000000006
    type: article-content
    enabled: true
    data:
      anchor: konfiguracja
      content:
        pl: |-
          ## 2. Wstrzyknij konfigurację docelowego środowiska

          `.env.local` należy do operatora wdrożenia, nie do Git ani artefaktu. W produkcji ustaw `APP_ENV=production`, wyłącz debug, użyj co najmniej 32 losowych bajtów w `APP_SECRET` i wymuś bezpieczne cookie sesji. `APP_RELEASE` powinien być niezmiennym identyfikatorem bieżącego artefaktu — najlepiej pełnym SHA commita lub numerem buildu — i musi zmienić się przy każdym wydaniu wpływającym na rendering.

          `config/setup.yml` zawiera publiczną konfigurację produktu. `site.url` musi wskazywać finalny origin HTTPS widziany przez użytkownika, nie wewnętrzny adres kontenera. `WEBAUTHN_RP_ID` jest samym hostem bez schematu, portu i ścieżki. Jego zmiana może odłączyć wcześniej zarejestrowane klucze bezpieczeństwa.

          Jeśli ruch przechodzi przez reverse proxy, wpisz do `TRUSTED_PROXIES` wyłącznie rzeczywiste adresy lub zakresy CIDR bezpośrednich proxy. Nie używaj `0.0.0.0/0` ani `::/0`. CMS ufa `X-Forwarded-For` dopiero wtedy, gdy bezpośredni peer znajduje się na tej liście; od tej decyzji zależą audit i limity prób logowania.
        en: |-
          ## 2. Inject target-environment configuration

          `.env.local` belongs to the deployment operator, not Git or the artifact. In production set `APP_ENV=production`, disable debug, use at least 32 random bytes for `APP_SECRET`, and require a secure session cookie. `APP_RELEASE` should be an immutable identifier of the current artifact—preferably the full commit SHA or build number—and must change for every release affecting rendering.

          `config/setup.yml` contains public product configuration. `site.url` must point to the final HTTPS origin visible to users, not an internal container address. `WEBAUTHN_RP_ID` is the bare host without scheme, port or path. Changing it can disconnect previously registered security keys.

          When traffic passes through a reverse proxy, put only the real addresses or CIDR ranges of direct proxies in `TRUSTED_PROXIES`. Never use `0.0.0.0/0` or `::/0`. The CMS trusts `X-Forwarded-For` only when the direct peer is on this list; audit and login throttling depend on this decision.
      note:
        pl: 'Sekret generuj poza historią powłoki, na przykład w menedżerze haseł lub systemowym magazynie sekretów.'
        en: 'Generate the secret outside shell history, for example in a password manager or system secret store.'
  -
    id: 01a09b30-8008-7807-8807-000000000007
    type: code-showcase
    enabled: true
    data:
      eyebrow:
        pl: 'Minimalne środowisko'
        en: 'Minimum environment'
      title:
        pl: 'Produkcja ma własne, jawne guardy.'
        en: 'Production has explicit guards.'
      description:
        pl: 'Wartości domeny i strefy są przykładowe. Parametry SMTP, retencji logów i cache dodaj zgodnie z wybraną infrastrukturą.'
        en: 'Domain and timezone values are examples. Add SMTP, log retention and cache parameters for the selected infrastructure.'
      filename: .env.local
      code: |-
        APP_ENV=production
        APP_DEBUG=0
        APP_SECRET=<at-least-32-random-bytes>
        APP_TIMEZONE=Europe/Warsaw
        APP_RELEASE=<full-git-sha-or-build-id>

        SESSION_COOKIE_SECURE=1
        SESSION_COOKIE_SAME_SITE=Lax
        WEBAUTHN_RP_ID=example.com
        TRUSTED_PROXIES=10.0.0.0/24
      bullets:
        -
          text:
            pl: 'ProductionGuard zatrzymuje niebezpieczny start.'
            en: 'ProductionGuard stops an unsafe startup.'
        -
          text:
            pl: 'APP_RELEASE oddziela namespace cache kolejnych wydań.'
            en: 'APP_RELEASE separates cache namespaces between releases.'
        -
          text:
            pl: 'Finalna domena wiąże cookie i WebAuthn z właściwym originem.'
            en: 'The final domain binds cookies and WebAuthn to the correct origin.'
  -
    id: 01a09b30-8008-7808-8808-000000000008
    type: article-content
    enabled: true
    data:
      anchor: host-uprawnienia
      content:
        pl: |-
          ## 3. Ogranicz serwer WWW do katalogu public

          Document root musi wskazywać dokładnie `public/`. Serwer może wykonywać wyłącznie `public/index.php`; inne pliki PHP powinny być odrzucane. Dzięki temu `pages/`, `config/`, `.env.local`, SQLite, logi, audit, źródła klas i szablony nie stają się plikami do pobrania. Gotowe punkty wyjścia znajdują się w `deploy/nginx.conf.example`, `deploy/apache2-vhost.conf.example` i `deploy/Caddyfile.example`.

          Dopasuj domenę, ścieżkę projektu i socket PHP-FPM. Nginx używa gzip; opcjonalny Brotli wymaga modułu `ngx_brotli`. Apache wymaga odpowiednich modułów SSL, rewrite, headers, proxy_fcgi, filter i kompresji. Caddy zarządza HTTPS automatycznie i negocjuje Zstandard lub gzip. Po zmianie konfiguracji najpierw uruchom test składni serwera, potem łagodny reload.

          Ustaw `upload_max_filesize` i `post_max_size` co najmniej na poziomie `media.maxUploadBytes`, zachowując skończony limit requestu w serwerze WWW. Wyłącz `display_errors`, pozostaw chronione `log_errors` i upewnij się, że wersja PHP-FPM jest tą samą wspieraną wersją 8.5+, którą sprawdził build.

          ## 4. Nadaj minimalne uprawnienia

          Proces PHP potrzebuje zapisu do `pages/`, `config/`, katalogów `storage/audit`, `storage/cache`, `storage/database`, `storage/logs`, `storage/sessions`, `storage/tmp` oraz `public/assets/blocks/`. Kod w `app/`, `blocks/`, `templates/`, `vendor/`, `bin/` i entrypointy PHP powinien być tylko do odczytu dla użytkownika serwera WWW.

          Nie naprawiaj błędów przez `chmod 0777`. Ustal właściciela procesu PHP, grupę wdrożeniową i minimalne prawa dla każdego korzenia. Kontrolowane katalogi nie mogą być symlinkami. Jeśli model wielu release wymaga linków, zamontuj trwały wolumin pod finalną ścieżką albo zastosuj mechanizm publikacji zgodny z kontrolami aplikacji.
        en: |-
          ## 3. Restrict the web server to public

          The document root must point exactly at `public/`. The server may execute only `public/index.php`; other PHP files should be rejected. This keeps `pages/`, `config/`, `.env.local`, SQLite, logs, audit, class sources and templates from becoming downloadable files. Starting configurations live in `deploy/nginx.conf.example`, `deploy/apache2-vhost.conf.example` and `deploy/Caddyfile.example`.

          Adapt the domain, project path and PHP-FPM socket. Nginx uses gzip; optional Brotli requires `ngx_brotli`. Apache needs the relevant SSL, rewrite, headers, proxy_fcgi, filter and compression modules. Caddy manages HTTPS automatically and negotiates Zstandard or gzip. After configuration changes, run the server syntax test first and perform a graceful reload second.

          Set `upload_max_filesize` and `post_max_size` at least as high as `media.maxUploadBytes` while keeping a finite request limit at the web server. Disable `display_errors`, retain protected `log_errors`, and confirm that PHP-FPM runs the same supported PHP 8.5+ line verified by the build.

          ## 4. Grant minimum permissions

          The PHP process needs write access to `pages/`, `config/`, `storage/audit`, `storage/cache`, `storage/database`, `storage/logs`, `storage/sessions`, `storage/tmp` and `public/assets/blocks/`. Code under `app/`, `blocks/`, `templates/`, `vendor/`, `bin/` and PHP entrypoints should be read-only for the web-server user.

          Do not repair failures with `chmod 0777`. Identify the PHP process owner, deployment group and minimum rights for every root. Controlled directories must not be symlinks. If a multi-release model needs links, mount persistent storage at the final path or use a publication mechanism compatible with application checks.
      note:
        pl: 'Najważniejszy test izolacji jest prosty — żądanie do `/.env.local`, `/composer.lock` lub `/pages/.../content.yml` nigdy nie może zwrócić zawartości pliku.'
        en: 'The most important isolation test is simple—a request for `/.env.local`, `/composer.lock` or `/pages/.../content.yml` must never return file contents.'
      bookmarkDescription:
        pl: 'Host I uprawnienia'
        en: 'Host and permissions'
  -
    id: 01a09b30-8008-7809-8809-000000000009
    type: article-content
    enabled: true
    data:
      anchor: migracja-preflight
      content:
        pl: |-
          ## 5. Migruj stan, a potem uruchom preflight

          Przed przełączeniem ruchu wykonaj `php bin/cms database:migrate`. Migracje schematu uwierzytelniania są addytywne, ale nadal pracują na trwałym stanie — przed pierwszym wdrożeniem nowej wersji zrób spójny backup SQLite. Nie uruchamiaj kilku migratorów równolegle.

          Następnie, z finalnym `.env.local` i jako właściwy użytkownik procesu, uruchom `php bin/cms release:check`. Polecenie kończy się kodem różnym od zera, jeśli brakuje warunku wydania. Sprawdza wersję PHP i rozszerzenia, produkcyjne guardy środowiska, istnienie i zapisywalność korzeni, HTTPS w `site.url`, wszystkie strony, kolekcje, bloki i lokalizowane nawigacje, redirecty, layout domyślny, schemat bazy oraz wymagane pliki release.

          Preflight nie jest smoke testem. Potwierdza spójność procesu i danych widzianych lokalnie przez PHP, lecz nie dowodzi, że DNS prowadzi do hosta, certyfikat obejmuje domenę, proxy przekazuje poprawne nagłówki albo użytkownik z Internetu otrzyma właściwą odpowiedź.

          Jeśli kontrola nie przechodzi, napraw pojedynczy zgłoszony kontrakt. Nie wyłączaj guardów i nie zmieniaj wszystkich uprawnień naraz. Po każdej korekcie uruchom pełny preflight ponownie.
        en: |-
          ## 5. Migrate state, then run preflight

          Before switching traffic, run `php bin/cms database:migrate`. Authentication-schema migrations are additive, but they still operate on durable state—take a consistent SQLite backup before the first deployment of a new version. Do not run multiple migrators concurrently.

          Next, with the final `.env.local` and as the correct process user, run `php bin/cms release:check`. The command exits non-zero when a release condition is missing. It checks the PHP version and extensions, production environment guards, existence and writability of roots, HTTPS in `site.url`, every page, collection, block and localized navigation, redirects, the default layout, database schema and required release files.

          Preflight is not a smoke test. It confirms process and data consistency as seen locally by PHP, but it does not prove that DNS reaches the host, the certificate covers the domain, the proxy sends correct headers or an Internet user receives the expected response.

          When a check fails, repair the single reported contract. Do not disable guards or change every permission at once. Run the full preflight again after each correction.
      note:
        pl: '`release:check` uruchamiaj także po odtworzeniu backupu i przed zakończeniem rollbacku.'
        en: 'Run `release:check` after restoring a backup and before completing a rollback as well.'
      bookmarkDescription:
        pl: 'Migracja i preflight'
        en: 'Migration and preflight'
  -
    id: 01a09b30-8008-7810-8810-000000000010
    type: code-showcase
    enabled: true
    data:
      eyebrow:
        pl: 'Bramka aktywacji'
        en: 'Activation gate'
      title:
        pl: 'Ruch trafia dopiero do sprawdzonego release.'
        en: 'Traffic reaches only a verified release.'
      description:
        pl: 'Kolejność oddziela modyfikację trwałego stanu, kontrolę aplikacji i obserwację zewnętrzną.'
        en: 'The order separates durable-state mutation, application verification and external observation.'
      filename: activate-release.sh
      code: |-
        php bin/cms database:migrate
        php bin/cms release:check

        # Atomically switch the web-server upstream or document root here.

        curl --fail --silent --show-error https://example.com/api/v1/health
        curl --fail --silent --show-error https://example.com/pl/
        curl --fail --silent --show-error https://example.com/api/v1/pages?lang=pl
      bullets:
        -
          text:
            pl: 'Migracja kończy się przed aktywacją kodu.'
            en: 'Migration completes before code activation.'
        -
          text:
            pl: 'Preflight blokuje wydanie niespójnego artefaktu.'
            en: 'Preflight blocks an inconsistent artifact.'
        -
          text:
            pl: 'Testy HTTP przechodzą przez publiczny origin.'
            en: 'HTTP tests pass through the public origin.'
        -
          text:
            pl: 'Każdy błąd zatrzymuje dalszy etap pipeline.'
            en: 'Every failure stops the next pipeline stage.'
