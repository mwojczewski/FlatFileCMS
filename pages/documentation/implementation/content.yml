  -
    id: 01a09b30-8008-7814-8814-000000000014
    type: article-content
    enabled: true
    data:
      anchor: backup-rollback
      content:
        pl: |-
          ## 8. Backupuj spójny zestaw i ćwicz odtwarzanie

          Snapshot release obejmuje `pages/`, `config/`, własne `blocks/` i `templates/` oraz zgodny artefakt kodu. SQLite w `storage/database/cms.sqlite` kopiuj tylko bez aktywnego zapisu albo przez mechanizm online backup SQLite. `.env.local` i inne sekrety przechowuj osobno, szyfrowane i z ograniczoną możliwością odczytu.

          Cache, sesje, wygenerowane zasoby bloków i warianty mediów są odtwarzalne. Nie muszą wydłużać krytycznej ścieżki backupu. Audit i logi mają inną wartość: ich retencja wynika z potrzeb bezpieczeństwa, prywatności i operacji, dlatego mogą trafiać do osobnego archiwum.

          Backup jest zweryfikowany dopiero po udanym odtworzeniu. Regularnie twórz izolowane środowisko, przywracaj kod, treść, bazę i sekrety, uruchamiaj migrację oraz `release:check`, a potem wykonuj pełny smoke test. Mierz czas przywrócenia i porównuj go z wymaganym RTO; sprawdzaj także, ile danych tracisz względem RPO.

          ## 9. Rollback przywraca kompatybilność, nie tylko stary kod

          Gdy nowe wydanie uszkadza działanie, zatrzymaj dalsze zapisy lub przejdź w kontrolowane okno serwisowe. Przywróć poprzedni artefakt razem z kompatybilnym snapshotem treści i schematu. Migracje bazy są addytywne, ale nie zakładaj automatycznie, że dowolny stary kod poprawnie obsłuży nowsze dane.

          Po przywróceniu ustaw identyfikator odpowiadający aktywnemu artefaktowi, uruchom `release:check`, przełącz ruch atomowo i powtórz smoke testy. Zachowaj logi i nieudany artefakt do analizy. Dopiero gdy publiczny monitoring jest stabilny, zamknij incydent i zaplanuj poprawkę jako nowe wydanie — nie jako ręczną edycję na serwerze.
        en: |-
          ## 8. Back up a consistent set and practise restoration

          A release snapshot includes `pages/`, `config/`, custom `blocks/` and `templates/`, plus a compatible code artifact. Copy `storage/database/cms.sqlite` only when no write is active or through SQLite's online backup mechanism. Keep `.env.local` and other secrets separately, encrypted and with restricted read access.

          Cache, sessions, generated block assets and media variants are reproducible. They need not extend the critical backup path. Audit and logs have a different value: retention follows security, privacy and operational requirements, so they may go to a separate archive.

          A backup becomes verified only after successful restoration. Regularly create an isolated environment, restore code, content, database and secrets, run migration and `release:check`, then perform the full smoke test. Measure restoration time against the required RTO and verify data loss against RPO.

          ## 9. Rollback restores compatibility, not only old code

          When a new release breaks operation, stop further writes or enter a controlled maintenance window. Restore the previous artifact together with a compatible content and schema snapshot. Database migrations are additive, but do not automatically assume that arbitrary old code handles newer data correctly.

          After restoration, set the identifier matching the active artifact, run `release:check`, switch traffic atomically and repeat smoke tests. Preserve logs and the failed artifact for analysis. Close the incident only when public monitoring is stable, and ship the correction as a new release—not a manual server edit.
      note:
        pl: 'Najkrótszy rollback bez sprawdzonego backupu bywa tylko szybszą drogą do drugiej awarii.'
        en: 'The shortest rollback without a tested backup can be only a faster route to a second failure.'
      bookmarkDescription:
        pl: 'Backup i rollback'
        en: 'Backup and rollback'
  -
    id: 01a09b30-8008-7815-8815-000000000015
    type: article-content
    enabled: true
    data:
      anchor: checklista-wdrozenia
      content:
        pl: |-
          ## 10. Checklista wydania

          1. Artefakt powstał z aktualnego `composer.lock` i przeszedł `composer check`.
          2. Produkcyjny artefakt nie zawiera zależności developerskich.
          3. `.env.local` pochodzi z chronionego źródła i nie leży w `public/`.
          4. `APP_ENV=production`, debug jest wyłączony, a sekret i cookie spełniają guardy.
          5. `APP_RELEASE` jednoznacznie identyfikuje nowe wydanie.
          6. `site.url` i `WEBAUTHN_RP_ID` odpowiadają finalnej domenie.
          7. `TRUSTED_PROXIES` zawiera tylko rzeczywiste proxy.
          8. Document root wskazuje dokładnie `public/` i wykonuje tylko `index.php`.
          9. PHP 8.5+, wymagane rozszerzenia, limity uploadu i PHP-FPM są zgodne.
          10. Zapis jest ograniczony do treści, konfiguracji i katalogów runtime.
          11. Przed migracją istnieje spójny backup SQLite i danych.
          12. `database:migrate` oraz `release:check` kończą się powodzeniem.
          13. Ruch jest przełączany atomowo, a poprzedni artefakt pozostaje dostępny.
          14. Smoke test obejmuje HTML, API, cache warunkowy, logowanie, zapis, upload i pocztę.
          15. Monitoring nie pokazuje nowych 5xx, opóźnień ani błędów aplikacji.
          16. Procedura rollbacku wskazuje zgodny artefakt i snapshot.
          17. Odtwarzanie backupu zostało praktycznie sprawdzone.

          Dobre wdrożenie nie polega na braku błędów w konsoli. Polega na tym, że wersja jest identyfikowalna, przejście jest atomowe, wynik mierzalny, a powrót możliwy bez zgadywania.
        en: |-
          ## 10. Release checklist

          1. The artifact was built from the current `composer.lock` and passed `composer check`.
          2. The production artifact contains no development dependencies.
          3. `.env.local` comes from a protected source and is not below `public/`.
          4. `APP_ENV=production`, debug is off, and secret and cookie pass the guards.
          5. `APP_RELEASE` identifies the new release unambiguously.
          6. `site.url` and `WEBAUTHN_RP_ID` match the final domain.
          7. `TRUSTED_PROXIES` contains only real proxies.
          8. The document root points exactly at `public/` and executes only `index.php`.
          9. PHP 8.5+, required extensions, upload limits and PHP-FPM are consistent.
          10. Write access is limited to content, configuration and runtime directories.
          11. A consistent SQLite and data backup exists before migration.
          12. `database:migrate` and `release:check` succeed.
          13. Traffic switches atomically and the previous artifact remains available.
          14. Smoke tests cover HTML, API, conditional cache, login, write, upload and mail.
          15. Monitoring shows no new 5xx responses, latency or application errors.
          16. The rollback procedure identifies a compatible artifact and snapshot.
          17. Backup restoration has been tested in practice.

          A good deployment is not the absence of console errors. It means the version is identifiable, the transition atomic, the result measurable and the return path available without guesswork.
      note:
        pl: 'Przechowuj checklistę razem z historią release. Po incydencie aktualizuj procedurę, nie tylko kod.'
        en: 'Store the checklist with release history. After an incident, update the procedure as well as the code.'
  -
