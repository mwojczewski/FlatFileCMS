  - id: 01a05e10-1001-7405-8405-000000000005
    type: article-content
    enabled: true
    data:
      anchor: content-model
      content:
        pl: |-
          ## 1. Zacznij od stabilnej tożsamości strony

          Strona nie jest identyfikowana przez publiczny URL. Katalog `pages/features/` jest jej stabilną tożsamością techniczną, natomiast `slug.pl` i `slug.en` mogą zmieniać się niezależnie:

          ```yaml
          schemaVersion: 1
          enabled: true
          layout: default
          slug:
            pl: mozliwosci
            en: features
          title:
            pl: Możliwości FlatFile CMS
            en: FlatFile CMS features
          blocks: []
          ```

          Przy dwóch aktywnych językach router buduje prefiksowane adresy `/pl/mozliwosci` i `/en/features`. Linki wewnętrzne przechowują tożsamość `features`, a `PageRouteIndex` rozwiązuje właściwy URL dla bieżącego locale. Dzięki temu zmiana slugu nie wymaga przepisywania nawigacji.

          Każdy dokument deklaruje `schemaVersion`. Pozwala to ewoluować format jawnie, zamiast rozpoznawać wersję na podstawie przypadkowej obecności pól.

          ## 2. Modeluj komponent w block.yml

          Blok jest pakietem deweloperskim odkrywanym automatycznie z `blocks/<type>/`. Minimalny pakiet zawiera schemat oraz renderer:

          ```text
          blocks/feature-card/
          ├── block.yml
          ├── render.php
          ├── style.css       # opcjonalny
          └── script.js       # opcjonalny
          ```

          Definicja pola jest wspólnym źródłem dla formularza panelu i walidatora:

          ```yaml
          fields:
            title:
              type: text
              required: true
              translatable: true
              minLength: 1
              maxLength: 120
            accent:
              type: select
              required: true
              options: [mint, violet, amber]
          ```

          `translatable: true` oznacza mapę locale, a nie gotowy string. Walidator wymaga wartości języka domyślnego, normalizuje wszystkie obecne tłumaczenia i podczas publikacji wybiera bieżący język z fallbackiem.

          Wbudowane typy pól to `text`, `textarea`, `markdown`, `number`, `boolean`, `select`, `multiselect`, `url`, `email`, `date`, `color`, `image`, `file` oraz `repeater`, który może zawierać zagnieżdżone pola. Nieznane pola danych są odrzucane — schemat jest kontraktem zamkniętym.

          ## 3. Renderuj wyłącznie znormalizowane dane

          `render.php` nie otrzymuje requestu, kontenera usług ani bezpośredniego dostępu do repozytoriów. Korzysta z tablicy `$data` i ograniczonego `RenderContext`:

          ```php
          <?php
          declare(strict_types=1);
          ?>
          <section class="feature-card">
              <h2><?= $context->escape($data['title']) ?></h2>
              <div><?= $context->markdown($data['content']) ?></div>
          </section>
          ```

          Tekst trafia do `escape()`, Markdown do skonfigurowanego CommonMark, adresy do `url()`, a obrazy do `image()` lub `picture()`. Ta dyscyplina oddziela zaufany kod szablonu od niezaufanej treści redakcyjnej.

          CSS i JavaScript bloku są zbierane tylko wtedy, gdy aktywny blok danego typu występuje na stronie. `AssetPublisher` ogranicza rozmiar źródła, odrzuca symlinki, wylicza SHA-256 i publikuje fingerprintowany plik pod `public/assets/blocks/`.
        en: |-
          ## 1. Start with a stable page identity

          A page is not identified by its public URL. The `pages/features/` directory is its stable technical identity, while `slug.pl` and `slug.en` can evolve independently:

          ```yaml
          schemaVersion: 1
          enabled: true
          layout: default
          slug:
            pl: mozliwosci
            en: features
          title:
            pl: Możliwości FlatFile CMS
            en: FlatFile CMS features
          blocks: []
          ```

          With two enabled languages the router creates `/pl/mozliwosci` and `/en/features`. Internal links store the `features` identity and `PageRouteIndex` resolves the correct URL for the active locale. A slug change therefore never requires rewriting navigation.

          Every document declares `schemaVersion`, allowing the format to evolve explicitly instead of guessing its version from incidental fields.

          ## 2. Model a component in block.yml

          A block is a developer-owned package discovered automatically in `blocks/<type>/`. The minimum package contains a schema and renderer:

          ```text
          blocks/feature-card/
          ├── block.yml
          ├── render.php
          ├── style.css       # optional
          └── script.js       # optional
          ```

          The field definition is the shared source for the admin form and validator:

          ```yaml
          fields:
            title:
              type: text
              required: true
              translatable: true
              minLength: 1
              maxLength: 120
            accent:
              type: select
              required: true
              options: [mint, violet, amber]
          ```

          `translatable: true` represents a locale map rather than a final string. The validator requires the default-language value, normalizes every supplied translation and selects the active language with fallback during publication.

          Built-in types cover text, Markdown, numbers, booleans, select, multiselect, URLs, e-mail, dates, colors, images, files and nested repeaters. Unknown data fields are rejected: the schema is a closed contract.

          ## 3. Render normalized data only

          `render.php` receives no request, service container or direct repository access. It works with `$data` and a constrained `RenderContext`:

          ```php
          <?php
          declare(strict_types=1);
          ?>
          <section class="feature-card">
              <h2><?= $context->escape($data['title']) ?></h2>
              <div><?= $context->markdown($data['content']) ?></div>
          </section>
          ```

          Plain text goes through `escape()`, Markdown through configured CommonMark, URLs through `url()` and images through `image()` or `picture()`. This discipline separates trusted template code from untrusted editorial content.

          Block CSS and JavaScript are collected only when an enabled block of that type appears on the page. `AssetPublisher` limits source size, rejects symlinks, calculates SHA-256 and publishes a fingerprinted file below `public/assets/blocks/`.
      note:
        pl: Treść wybiera wyłącznie nazwę bloku i jego dane. Nigdy nie wskazuje ścieżki do pliku PHP.
        en: Content selects only a block name and its data. It never supplies a path to a PHP file.
