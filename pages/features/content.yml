  - id: 01a05e10-1001-7407-8407-000000000007
    type: article-content
    enabled: true
    data:
      anchor: collections-media
      content:
        pl: |-
          ## 4. Buduj kolekcje bez osobnego kontrolera

          Katalog z `pagination.yml` staje się kolekcją, a jego bezpośrednie podstrony są źródłem rekordów. Konfiguracja określa sortowanie, paginację i jawnie dozwolone filtry:

          ```yaml
          schemaVersion: 1
          type: collection
          enabled: true
          layout: insights
          source: children
          sort:
            field: date
            direction: desc
          pagination:
            perPage: 8
          filters:
            - parameter: category
              field: category
              allowedValues: [architecture, security, media]
          ```

          `CollectionService` nie wykonuje dowolnych zapytań przekazanych przez użytkownika. Parametr może filtrować tylko wskazane pole i tylko po wartościach z allowlisty. Wynik zawiera stabilne informacje o stronie, liczbie elementów i całkowitej liczbie stron.

          Ten sam wynik trafia do `CollectionRenderer` oraz `CollectionSerializer`. Layout kolekcji odpowiada za HTML listy, natomiast API udostępnia dane integracjom frontendowym.

          ## 5. Lokalizuj na granicy modelu

          `config/languages.yml` wskazuje język domyślny i języki aktywne. Repozytorium przechowuje mapy tłumaczeń, ale renderer bloku otrzymuje już pojedynczą wartość wybraną dla bieżącego locale.

          Gdy tłumaczenie opcjonalne nie istnieje, framework używa wartości języka domyślnego. Required field musi mieć poprawną wartość źródłową. Ten mechanizm pozwala włączyć nowy język bez atomowej migracji wszystkich historycznych dokumentów.

          Slugi są rozwiązywane osobno dla każdego locale, a ich unikalność jest sprawdzana w obrębie rodzeństwa. Przy wielu językach publiczne trasy zawsze mają prefiks, na przykład `/pl/mozliwosci` i `/en/features`.

          ## 6. Traktuj obrazy jako dane strony

          Pole `image` przechowuje bezpieczną ścieżkę względną względem katalogu strony oraz ALT zależny od użycia:

          ```yaml
          image:
            src: cover.png
            alt:
              pl: Diagram pipeline'u renderowania
              en: Rendering pipeline diagram
          ```

          Walidacja odrzuca traversal, symlinki, brak pliku i nieobsługiwane rozszerzenia. `MediaOutputEnricher` dodaje publiczny URL, MIME, rozmiar i wymiary. Renderer może użyć `image()` dla prostego znacznika albo `picture()` dla kontrolowanego source setu.

          SVG przechodzi sanitizację, a raster może otrzymać warianty zależne od konfiguracji jakości, maksymalnych wymiarów i limitu pikseli. Publiczny fingerprint umożliwia długi cache bez ryzyka serwowania starej zawartości po zmianie pliku.
        en: |-
          ## 4. Build collections without a dedicated controller

          A directory containing `pagination.yml` becomes a collection and its direct child pages become records. Configuration defines sorting, pagination and explicitly allowed filters:

          ```yaml
          schemaVersion: 1
          type: collection
          enabled: true
          layout: insights
          source: children
          sort:
            field: date
            direction: desc
          pagination:
            perPage: 8
          filters:
            - parameter: category
              field: category
              allowedValues: [architecture, security, media]
          ```

          `CollectionService` never executes arbitrary user-supplied queries. A parameter may filter only the configured field and only by allowlisted values. Results contain stable page, item-count and total-page information.

          The same result reaches `CollectionRenderer` and `CollectionSerializer`. The collection layout owns list HTML while the API exposes data to frontend integrations.

          ## 5. Localize at the model boundary

          `config/languages.yml` defines the default and enabled languages. Repositories store translation maps, but a block renderer receives one value selected for the active locale.

          When an optional translation is missing, the framework uses the default-language value. A required field must have a valid source value. This lets teams enable a new language without atomically migrating every historical document.

          Slugs are resolved independently for each locale and uniqueness is checked among siblings. With multiple languages, public routes always have a prefix such as `/pl/mozliwosci` and `/en/features`.

          ## 6. Treat images as page data

          An `image` field stores a safe path relative to the page directory and usage-specific ALT text:

          ```yaml
          image:
            src: cover.png
            alt:
              pl: Diagram pipeline'u renderowania
              en: Rendering pipeline diagram
          ```

          Validation rejects traversal, symlinks, missing files and unsupported extensions. `MediaOutputEnricher` adds a public URL, MIME type, size and dimensions. Renderers can use `image()` for a simple element or `picture()` for a controlled source set.

          SVG is sanitized while raster files can receive variants based on configured quality, dimensions and pixel limits. A public fingerprint enables long caching without serving stale content after a file changes.
      note:
        pl: Kolekcja jest konfiguracją zapytania nad stronami, a nie osobnym typem danych przechowywanym w bazie.
        en: A collection is a query configuration over pages, not a separate database-backed content type.
  - id: 01a05e10-1001-7408-8408-000000000008
    type: article-content
    enabled: true
    data:
      anchor: security-tests
      content:
        pl: |-
          ## 7. Zapisuj atomowo i wykrywaj konflikty

          Panel administracyjny nie nadpisuje YAML-a bezpośrednio. Edytowalny dokument posiada rewizję wyliczoną z aktualnego pliku. Mutacja przyjmuje oczekiwaną rewizję, uzyskuje blokadę zasobu, ponownie odczytuje dokument i odrzuca zapis, jeżeli stan zdążył się zmienić.

          Nowa treść jest walidowana przed publikacją. Zapis trafia najpierw do prywatnego pliku tymczasowego, a następnie jest atomowo podmieniany. Awaria procesu nie pozostawia połowy YAML-a, a nieudana walidacja nie zmienia rewizji dokumentu.

          `SafePathResolver` rozdziela zaufane korzenie (`pages`, `config`, `storage`) od względnych ścieżek danych. Normalizacja i sprawdzenie realpath zapobiegają wyjściu poza katalog, także przez symlink.

          ## 8. Oddziel treść od stanu bezpieczeństwa

          Użytkownicy, sesje, credentiale WebAuthn i tokeny resetu hasła należą do warstwy runtime, a nie do YAML-a treści. SQLite zapewnia transakcje dla danych uwierzytelniania, podczas gdy strony zachowują przenośność i czytelną historię Git.

          Panel stosuje CSRF, bezpieczne flagi cookie, rate limiting oraz role. Operacje administracyjne zapisują zdarzenia audytowe w formacie JSONL z aktorem, typem działania, zasobem i adresem klienta.

          Publiczny endpoint konfiguracji udostępnia wyłącznie świadomie zbudowaną projekcję. Surowy `setup.yml`, ścieżki dyskowe, ustawienia SMTP i inne sekrety nigdy nie są automatycznie serializowane.

          ## 9. Weryfikuj zachowanie na trzech poziomach

          Rozszerzenie frameworka warto testować warstwowo:

          1. test jednostkowy typu pola lub walidatora,
          2. test repozytorium na tymczasowym projekcie,
          3. test funkcjonalny publicznej trasy HTML i API.

          Standardowy pipeline projektu uruchamia formatowanie, analizę statyczną i komplet testów:

          ```bash
          composer check
          ```

          PHP CS Fixer pilnuje jednolitego kodu, PHPStan sprawdza kontrakty typów, a PHPUnit weryfikuje zachowanie bez zależności od produkcyjnego filesystemu.

          ## Co dalej

          Ta strona jest mapą systemu. Kolejny tutorial — **Pierwsze uruchomienie** — przeprowadzi przez wymagania, instalację, konfigurację środowiska, utworzenie administratora i publikację pierwszej strony.
        en: |-
          ## 7. Write atomically and detect conflicts

          The administration panel never overwrites YAML directly. An editable document carries a revision calculated from its current file. A mutation accepts the expected revision, obtains a resource lock, rereads the document and rejects the write when state has changed in the meantime.

          New content is validated before publication. Data is first written to a private temporary file and then atomically moved into place. A process failure cannot leave half a YAML document and failed validation never changes the document revision.

          `SafePathResolver` separates trusted roots (`pages`, `config`, `storage`) from relative data paths. Normalization and realpath checks prevent escaping the root, including through symlinks.

          ## 8. Separate content from security state

          Users, sessions, WebAuthn credentials and password-reset tokens belong to the runtime layer rather than content YAML. SQLite provides transactions for authentication data while pages remain portable and retain readable Git history.

          The panel applies CSRF protection, secure cookie flags, rate limiting and roles. Administrative operations record JSONL audit events with the actor, action type, resource and client address.

          The public configuration endpoint exposes only a deliberately constructed projection. Raw `setup.yml`, filesystem paths, SMTP configuration and other secrets are never serialized automatically.

          ## 9. Verify behavior at three levels

          Framework extensions should be tested in layers:

          1. a unit test for the field type or validator,
          2. a repository test using a temporary project,
          3. a functional test of the public HTML route and API.

          The standard project pipeline runs formatting, static analysis and the complete test suite:

          ```bash
          composer check
          ```

          PHP CS Fixer enforces consistent source, PHPStan checks type contracts and PHPUnit verifies behavior without depending on the production filesystem.

          ## What comes next

          This page is a map of the system. The next tutorial — **Pierwsze uruchomienie** — will cover requirements, installation, environment configuration, administrator creation and publishing the first page.
      note:
        pl: Dobra funkcja frameworka kończy się testowalnym kontraktem, a nie tylko działającym ekranem panelu.
        en: A good framework feature ends with a testable contract, not merely a working admin screen.
