schemaVersion: 1
name: { pl: Siatka możliwości, en: Feature grid }
description:
  {
    pl: Zestaw najważniejszych możliwości produktu.,
    en: Product feature overview.,
  }
icon: grid-2
fields:
  eyebrow:
    {
      type: text,
      required: true,
      translatable: true,
      maxLength: 80,
      label: { pl: Etykieta, en: Eyebrow },
    }
  title:
    {
      type: text,
      required: true,
      translatable: true,
      maxLength: 160,
      label: { pl: Nagłówek, en: Heading },
    }
  intro:
    {
      type: textarea,
      required: true,
      translatable: true,
      maxLength: 500,
      label: { pl: Wprowadzenie, en: Introduction },
    }
  items:
    type: repeater
    required: true
    translatable: false
    minItems: 3
    maxItems: 8
    label: { pl: Funkcje, en: Features }
    fields:
      number:
        {
          type: text,
          required: true,
          translatable: false,
          maxLength: 4,
          label: { pl: Numer, en: Number },
        }
      title:
        {
          type: text,
          required: true,
          translatable: true,
          maxLength: 90,
          label: { pl: Tytuł, en: Title },
        }
      description:
        {
          type: textarea,
          required: true,
          translatable: true,
          maxLength: 400,
          label: { pl: Opis, en: Description },
        }
      accent:
        {
          type: select,
          required: true,
          translatable: false,
          options: [mint, violet, amber],
          label: { pl: Akcent, en: Accent },
        }
